<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LMS Praktikum Microsoft Word</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--blue:#2B579A;--soft:#e8eef8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--ink:#f3f4f6;--mute:#9ca3af;--line:#374151;--soft:#1e2a44}}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
@media print{body{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem}
.nav-btn{display:block;width:100%;text-align:left;padding:.55rem .75rem;border-radius:.5rem;font-size:.88rem}
.nav-btn.on{background:var(--blue);color:#fff}.nav-btn:not(.on):hover{background:var(--soft)}
.tab{padding:.45rem .9rem;border-radius:.5rem;font-size:.85rem;border:1px solid var(--line)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sheet{overflow-x:auto}
.paper{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;font-size:13px;line-height:1.35;padding:38px 42px;aspect-ratio:210/297;width:100%;min-width:360px;max-width:600px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid #d1d5db;position:relative}
.cal{font-family:Calibri,Carlito,Arial,sans-serif}
.paper p{margin:0}.paper .tg{display:inline-block;width:2.4em}
.badge{position:absolute;top:8px;right:10px;font:600 10px Arial;color:#fff;padding:2px 8px;border-radius:99px}
.ld{display:flex;align-items:baseline;gap:4px;margin:2px 0}.ld i{flex:1;border-bottom:2px dotted #333}
.ip{display:inline-block;width:4.2em;text-align:right}.un{min-width:4.5em;text-align:right}
.kv{display:grid;margin:1px 0}.box5{background:#2B579A;color:#fff;font:600 11px Arial;padding:8px 10px;border-radius:6px}
.dc::first-letter{float:left;font-size:44px;line-height:38px;padding:2px 6px 0 0;font-weight:700;color:#2B579A}
.cols{column-count:2;column-gap:26px;column-rule:1px solid #222;text-align:justify;font-size:12.5px}
table.t5{border-collapse:collapse;width:100%;font-size:12px}table.t5 td,table.t5 th{border:1px solid #4472C4;padding:3px 6px}
</style>
</head>
<body>
<header class="text-white" style="background:#2B579A">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-3">
    <div class="w-10 h-10 rounded-lg bg-white text-[#2B579A] font-bold text-xl flex items-center justify-center">W</div>
    <div class="flex-1"><h1 class="text-lg md:text-xl font-bold">LMS Praktikum Microsoft Word</h1><p class="text-xs md:text-sm text-blue-100">Ketik ulang teks Before, format hingga sama dengan After.</p></div>
  </div>
</header>
<div class="max-w-7xl mx-auto px-4 py-5 grid lg:grid-cols-[250px_1fr] gap-5">
  <aside><div class="card p-3 lg:sticky lg:top-4 lg:max-h-[92vh] lg:overflow-y-auto">
    <label class="text-xs" style="color:var(--mute)">Nama siswa</label>
    <input id="nm" class="w-full mt-1 mb-3 px-3 py-2 rounded-lg border text-sm" style="background:var(--bg);border-color:var(--line);color:var(--ink)" placeholder="Tulis nama Anda">
    <button id="menuBtn" class="lg:hidden w-full text-left font-semibold px-1 py-1">☰ Daftar Latihan</button>
    <nav id="nav" class="hidden lg:block space-y-1 mt-2"></nav>
    <div class="mt-3 pt-3 border-t" style="border-color:var(--line)"><div class="text-xs mb-1" style="color:var(--mute)">Progres: <b id="pct">0%</b> · Rata-rata skor: <b id="avg">–</b></div>
    <div class="h-2 rounded-full" style="background:var(--line)"><div id="bar" class="h-2 rounded-full transition-all" style="background:var(--blue);width:0"></div></div></div>
  </div></aside>
  <main id="main" class="min-w-0"></main>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-white text-sm hidden" style="background:#1f2937;z-index:50"></div>
<script>
const M=[{"no": 1, "title": "Formatting Font & Paragraf Dasar", "goal": "Mengatur jenis huruf (Font), ukuran, gaya cetak (Bold, Italic, Underline), warna teks, perataan paragraf (Align Left, Center, Right, Justify), dan spasi baris (Line Spacing).", "menu": "Tab Home → grup Font dan grup Paragraph.", "steps": ["Buka dokumen baru, atur kertas A4 dengan margin Normal (Layout → Margins → Normal). Simpan sebagai Latihan1.docx.", "Salin naskah dari file bahan latihan lalu tempel (Paste) ke dokumen.", "Judul “PENGUMUMAN RESMI”: Font Arial Black, ukuran 18 pt, Bold, warna biru (Blue, Accent 1), perataan Center.", "Subjudul baris kedua: Font Calibri, ukuran 12 pt, Italic, Center. Beri garis bawah (Underline) hanya pada kata “Pekan Literasi”.", "Seluruh isi pengumuman: Font Times New Roman, ukuran 12 pt, perataan Justify, Line Spacing 1,5.", "Pada paragraf isi, tebalkan (Bold) tanggal pelaksanaan dan beri warna merah pada kata “wajib”.", "Baris “Hormat kami,” dan “Panitia Pekan Literasi” diratakan ke kanan (Align Right). Nama panitia di-Bold.", "Beri Paragraph Spacing After 6 pt pada semua paragraf isi (Layout → Spacing → After). Periksa tampilan di Print Preview."], "tips": "Gunakan Ctrl+B (Bold), Ctrl+I (Italic), Ctrl+U (Underline), Ctrl+E (Center), Ctrl+R (Right), Ctrl+J (Justify), Ctrl+L (Left). Jika format tidak diinginkan, tekan Ctrl+Space untuk membersihkan format huruf.", "raw": ["PENGUMUMAN RESMI", "Pekan Literasi SMK Nusantara Tahun Pelajaran 2026/2027", "Diberitahukan kepada seluruh siswa bahwa sekolah akan menyelenggarakan Pekan Literasi pada tanggal 17 sampai 21 Mei 2027 di lingkungan SMK Nusantara. Kegiatan ini bertujuan menumbuhkan minat baca dan budaya menulis di kalangan siswa.", "Rangkaian kegiatan meliputi lomba membaca puisi, bedah buku, bursa buku murah, dan pameran karya tulis siswa. Seluruh siswa wajib hadir mengenakan seragam lengkap dan membawa satu buku bacaan favorit masing-masing.", "Siswa yang berminat mengikuti lomba dapat mendaftar kepada wali kelas paling lambat tanggal 10 Mei 2027. Pendaftaran tidak dipungut biaya.", "Demikian pengumuman ini disampaikan untuk dilaksanakan dengan penuh tanggung jawab. Atas perhatian dan kerja sama seluruh siswa, kami ucapkan terima kasih.", "Hormat kami,", "Panitia Pekan Literasi"], "rubric": [["Font, ukuran, dan warna judul sesuai", 20], ["Gaya cetak (Bold/Italic/Underline) tepat sasaran", 20], ["Perataan paragraf sesuai (Center, Justify, Right)", 30], ["Line Spacing 1,5 dan Spacing After diterapkan", 30]]}, {"no": 2, "title": "Indentasi & Border/Shading", "goal": "Mengatur First Line Indent, Hanging Indent, Left/Right Indent, serta memberikan bingkai (Borders) dan warna latar paragraf (Shading).", "menu": "Home → Paragraph (peluncur dialog) → Indents and Spacing; Home → Borders and Shading.", "steps": ["Salin naskah ke dokumen baru, simpan sebagai Latihan2.docx. Atur seluruh teks: Calibri 12 pt.", "Judul “Tata Tertib Perpustakaan Sekolah”: Bold, Center, 14 pt.", "Paragraf pembuka: Justify dan First Line Indent 1,25 cm (Paragraph → Special → First line → 1,25 cm).", "Lima poin ketentuan: beri Hanging Indent 1 cm (Special → Hanging → 1 cm) sehingga angka menjorok ke kiri dan teks baris kedua rata di bawah huruf pertama.", "Paragraf kutipan: atur Left Indent 1,5 cm dan Right Indent 1,5 cm, gaya Italic.", "Blok paragraf kutipan, buka Borders → Borders and Shading → Setting Box, Style garis tunggal, Color biru, Width 1½ pt, Apply to: Paragraph.", "Pada tab Shading, pilih Fill biru muda (Blue, Accent 1, Lighter 80%).", "Paragraf penutup: Left Indent 0, Justify. Beri Border Bottom saja pada judul (garis 2¼ pt)."], "tips": "Ruler (View → Ruler) menampilkan penanda indent: segitiga atas = First Line, segitiga bawah = Hanging, kotak = Left Indent. Menggeser penanda ini adalah cara cepat, tetapi dialog Paragraph lebih presisi.", "raw": ["Tata Tertib Perpustakaan Sekolah", "Perpustakaan sekolah terbuka bagi seluruh siswa setiap hari kerja pukul 07.00 sampai 15.00 WIB. Agar layanan berjalan tertib dan nyaman, setiap pengunjung diharapkan memperhatikan ketentuan berikut ini dengan seksama.", "1. Setiap siswa dapat meminjam paling banyak tiga buku untuk jangka waktu tujuh hari kerja dengan menunjukkan kartu anggota perpustakaan.", "2. Keterlambatan pengembalian buku dikenakan denda sebesar Rp500 per hari untuk setiap buku yang terlambat dikembalikan.", "3. Buku yang hilang atau rusak wajib diganti dengan judul dan edisi yang sama paling lambat dua minggu setelah pelaporan.", "4. Pengunjung dilarang makan, minum, dan berbicara dengan suara keras di dalam ruang baca.", "5. Tas dan barang bawaan harus dititipkan pada loker yang telah disediakan di depan pintu masuk.", "“Buku adalah jendela dunia, dan membaca adalah kunci untuk membukanya. Siapa yang gemar membaca akan menemukan dunia yang tak terbatas.”", "Mari bersama-sama menjaga kenyamanan perpustakaan demi kemajuan seluruh warga sekolah."], "rubric": [["First Line Indent pada paragraf pembuka", 20], ["Hanging Indent pada lima poin ketentuan", 30], ["Left dan Right Indent pada kutipan", 20], ["Border kotak dan Shading pada kutipan", 30]]}, {"no": 3, "title": "Tabulasi (Tabs)", "goal": "Menggunakan Left Tab, Right Tab, Decimal Tab, dan Tab Leader (titik-titik otomatis) untuk menyusun daftar yang rapi dan sejajar.", "menu": "Home → Paragraph → Tabs… (atau klik ruler untuk menaruh tab stop).", "steps": ["Salin naskah ke dokumen baru (tanda tab sudah ada di antara kolom). Simpan sebagai Latihan3.docx.", "Judul “DAFTAR HARGA KANTIN SEKOLAH”: Bold, Center, 14 pt. Sub judul “Bagian A” Left.", "Blok baris daftar makanan (Nasi Goreng s.d. Jus Alpukat). Buka Paragraph → Tabs. Isi Tab stop position 9 cm, Alignment Decimal, Leader 2 (titik-titik). Klik Set.", "Tambahkan Tab kedua pada 15,5 cm, Alignment Right, Leader 1 (tanpa leader) untuk kolom Satuan/Stok. Klik Set lalu OK.", "Pastikan setiap baris memakai tombol Tab satu kali per kolom, bukan Spacebar. Angka harus sejajar tepat pada koma desimal.", "Bagian B “Daftar Isi Modul”: blok baris, buat Tab Right pada 14 cm dengan Leader 2 sehingga nomor halaman rata kanan dengan titik-titik di depannya.", "Bagian C “Riwayat Hidup Singkat”: buat Left Tab pada 4 cm agar titik dua sejajar.", "Tampilkan simbol tersembunyi (Ctrl+Shift+8) untuk memastikan hanya ada satu tanda tab (panah) di setiap kolom."], "tips": "Klik kotak kecil di pojok kiri atas ruler untuk berganti jenis tab (Left, Center, Right, Decimal). Klik pada ruler untuk menaruh tab stop. Seret tab stop keluar dari ruler untuk menghapusnya.", "raw": ["DAFTAR HARGA KANTIN SEKOLAH", "Bagian A. Daftar Makanan dan Minuman", "Nasi Goreng Spesial\t12.500,00\tPorsi", "Mie Ayam Bakso\t10.000,00\tMangkuk", "Es Teh Manis\t3.500,50\tGelas", "Jus Alpukat\t9.000,00\tGelas", "Bagian B. Daftar Isi Modul Praktikum", "Bab 1 Font dan Paragraf\t1", "Bab 2 Indentasi dan Border\t5", "Bab 3 Tabulasi\t9", "Bab 4 Drop Cap dan Kolom\t13", "Bagian C. Riwayat Hidup Singkat", "Nama\t: Rina Aprilia Putri", "Tempat/Tanggal Lahir\t: Medan, 12 Agustus 2009", "Alamat\t: Jalan Pendidikan No. 10, Medan", "Pendidikan\t: SMK Nusantara, Jurusan Multimedia"], "rubric": [["Decimal Tab menyejajarkan koma desimal", 30], ["Tab Leader titik-titik berfungsi (Bagian A dan B)", 30], ["Right Tab pada kolom satuan/nomor halaman", 20], ["Tidak memakai Spacebar untuk perataan", 20]]}, {"no": 4, "title": "Drop Cap & Kolom Koran", "goal": "Membuat efek huruf besar di awal paragraf (Drop Cap: Dropped dan In Margin) dan membagi teks menjadi 2 atau 3 kolom dengan garis pemisah (Line Between).", "menu": "Insert → Drop Cap; Layout → Columns → More Columns.", "steps": ["Salin naskah artikel ke dokumen baru. Simpan sebagai Latihan4.docx. Atur isi artikel Times New Roman 12 pt, Justify.", "Judul artikel “Kebun Sekolah Kami” dan baris penulis: Center, judul 20 pt Bold, penulis 11 pt Italic. Biarkan keduanya tetap satu kolom.", "Blok semua paragraf isi (tanpa judul dan nama penulis). Pilih Layout → Columns → Two.", "Buka Layout → Columns → More Columns. Aktifkan Line Between, atur Spacing 1 cm, pastikan Apply to: Selected text.", "Klik paragraf pertama, pilih Insert → Drop Cap → Dropped. Pada Drop Cap Options atur Lines to drop 3, Distance from text 0,2 cm.", "Salin hasil ke halaman baru. Ubah menjadi Three Columns dan gunakan Drop Cap → In Margin pada paragraf pertama untuk membandingkan.", "Beri Column Break (Ctrl+Shift+Enter) sebelum paragraf “Dampak bagi Lingkungan” agar kolom kedua dimulai dari judul bagian tersebut.", "Periksa agar kolom seimbang di akhir artikel (Layout → Breaks → Continuous setelah teks)."], "tips": "Jika teks tidak terbagi ke kolom seperti harapan, pastikan Anda memblok teks sebelum membagi kolom, atau sisipkan Section Break (Continuous) agar bagian judul tidak ikut terbagi.", "raw": ["Kebun Sekolah Kami", "Oleh: Redaksi Buletin SMK Nusantara", "Kebun sekolah kini menjadi tempat belajar yang menyenangkan bagi seluruh siswa. Setiap pagi sebelum jam pelajaran dimulai, kelas-kelas bergiliran menyiram dan merawat tanaman sayur yang telah ditanam sejak awal semester. Sawi, kangkung, dan cabai tumbuh subur di petak-petak kecil yang rapi.", "Selain mengajarkan tanggung jawab, kegiatan berkebun juga melatih kerja sama. Siswa belajar membagi tugas, mencatat pertumbuhan tanaman setiap minggu, dan menghitung hasil panen. Guru mata pelajaran biologi dan matematika memanfaatkan catatan tersebut sebagai bahan pembelajaran langsung di lapangan.", "Dampak bagi Lingkungan. Hasil panen sebagian dijual di kantin sekolah dan sebagian lainnya disumbangkan kepada warga sekitar yang membutuhkan. Uang hasil penjualan dipakai untuk membeli bibit baru dan perlengkapan berkebun. Sampah dedaunan diolah menjadi kompos sehingga lingkungan sekolah tetap bersih.", "Semoga semangat ini terus tumbuh dan menginspirasi sekolah-sekolah lain untuk melakukan hal serupa. Kebun bukan sekadar petak tanah, melainkan ruang kelas terbuka tempat siswa belajar mencintai alam dan bekerja dengan sepenuh hati."], "rubric": [["Teks terbagi dua kolom dengan Line Between", 30], ["Drop Cap Dropped 3 baris pada paragraf pertama", 30], ["Variasi tiga kolom dan Drop Cap In Margin", 20], ["Judul tetap satu kolom dan kolom seimbang", 20]]}, {"no": 5, "title": "Menyisipkan Objek (Insert Objects)", "goal": "Menyisipkan dan mengatur posisi (Text Wrapping) gambar/ilustrasi, Shapes (bagan alur sederhana), WordArt untuk judul menarik, dan Tabel sederhana dalam satu brosur/poster.", "menu": "Tab Insert → Pictures, Shapes, WordArt, Table; tab Picture Format → Wrap Text.", "steps": ["Buka dokumen baru, orientasi Portrait, margin Narrow. Simpan sebagai Latihan5.docx. Salin naskah ke dalam dokumen.", "Judul “BAKTI SOSIAL OSIS 2027”: hapus dari teks biasa, lalu Insert → WordArt, pilih gaya yang jelas terbaca, ubah Text Effects → Transform → Arch Up.", "Insert → Pictures (foto/ilustrasi apa saja bertema kegiatan sosial). Atur Wrap Text → Square, letakkan di sisi kanan paragraf pembuka, ukuran sekitar 5 cm × 4 cm.", "Ubah teks “Hari/Tanggal | Waktu | Kegiatan …” menjadi tabel: blok baris jadwal → Insert → Table → Convert Text to Table, Separate text at: Other ( | ).", "Beri tabel style Grid Table 4 – Accent 1, baris header Bold dan rata tengah. Aktifkan AutoFit → AutoFit to Contents.", "Insert → Shapes: gambar tiga Rounded Rectangle dan dua Right Arrow untuk alur Pendaftaran → Seleksi → Pengumuman.", "Klik kanan setiap shape → Add Text, isi nama tahap. Beri Shape Fill biru dan teks putih. Sejajarkan dengan Align → Align Middle dan Distribute Horizontally.", "Kelompokkan (Group) ketiga shape dan panah agar mudah dipindahkan. Tambahkan Page Border (Design → Page Borders) sebagai sentuhan akhir."], "tips": "Gunakan Layout Options (ikon kecil di sudut gambar) untuk mengganti Text Wrapping dengan cepat. Tahan tombol Shift saat menarik shape agar proporsinya tetap sama, dan tahan Alt agar posisi bergerak lebih halus.", "raw": ["BAKTI SOSIAL OSIS 2027", "OSIS SMK Nusantara mengajak seluruh siswa mengikuti kegiatan bakti sosial di Panti Asuhan Harapan Bangsa. Dalam kegiatan ini siswa akan membersihkan lingkungan panti, membagikan paket sembako kepada warga sekitar, dan bermain bersama anak-anak panti asuhan.", "Setiap siswa yang ikut serta diharapkan membawa sarung tangan, botol minum, dan semangat gotong royong. Kegiatan ini sekaligus menjadi sarana belajar peduli sesama dan bekerja dalam tim.", "Jadwal Kegiatan", "Hari/Tanggal | Waktu | Kegiatan", "Sabtu, 5 Juni 2027 | 07.30 | Kumpul dan pengarahan", "Sabtu, 5 Juni 2027 | 08.30 | Kerja bakti lingkungan panti", "Sabtu, 5 Juni 2027 | 10.30 | Pembagian sembako", "Sabtu, 5 Juni 2027 | 12.00 | Makan siang bersama dan penutupan", "Alur Pendaftaran: Daftar kepada pengurus OSIS, Seleksi Berkas, Pengumuman Peserta.", "Informasi lebih lanjut hubungi sekretariat OSIS di ruang kegiatan siswa."], "rubric": [["WordArt judul dan efek Transform", 20], ["Gambar dengan Text Wrapping Square", 20], ["Tabel hasil konversi dengan style dan header", 30], ["Bagan alur Shapes rapi dan tergrup", 30]]}, {"no": 6, "title": "Pembuatan Surat Resmi & Kop Surat", "goal": "Membuat kop surat institusi dengan garis bawah ganda, mengatur tanggal, nomor surat, lampiran, perihal, isi surat resmi, hingga blok tanda tangan menggunakan tabel tanpa garis (No Border) atau tabulasi.", "menu": "Home → Borders; Insert → Table; Paragraph → Tabs.", "steps": ["Buka dokumen baru ukuran A4 (21 × 29,7 cm), margin Normal, font Times New Roman 12 pt. Simpan sebagai Latihan6.docx.", "Kop surat: nama sekolah 16 pt Bold Center huruf kapital, dua baris alamat 10 pt Center.", "Beri garis bawah kop: Home → Borders → Borders and Shading → Bottom, Style double line (garis ganda) atau Thick-Thin, lebar 3 pt.", "Nomor, Lampiran, dan Perihal: buat Left Tab pada 3 cm. Pada naskah, tanda titik dua sudah diawali tab sehingga titik dua sejajar vertikal.", "Tanggal surat dan “Kepada Yth.” dengan pilihan perataan sesuai kaidah surat resmi (tanggal rata kiri atau kanan sesuai model yang dipilih).", "Isi surat: Justify, First Line Indent 1,25 cm, Line Spacing 1,15. Rincian Hari/Tanggal, Waktu, Tempat menggunakan Left Tab pada 4 cm dan Left Indent 1,25 cm.", "Blok tanda tangan: Insert → Table 2 kolom × 1 baris. Kolom kiri kosong, kolom kanan berisi tempat, tanggal, jabatan, ruang tanda tangan, nama, dan NIP.", "Pilih tabel, klik Borders → No Border agar garis tabel tidak tampak. Gunakan View Gridlines untuk membantu mengatur posisi."], "tips": "Sisipkan Ctrl+Enter pada akhir surat bila ingin lampiran di halaman baru. Untuk surat bernomor otomatis, gunakan Mail Merge saat harus membuat surat serupa untuk banyak penerima.", "raw": ["SMK NUSANTARA", "Jalan Pendidikan No. 10, Medan, Sumatera Utara 20112", "Telepon (061) 555-1234 | Email: info@smknusantara.sch.id", "Nomor\t: 045/SMK-N/V/2027", "Lampiran\t: 1 (satu) berkas", "Perihal\t: Undangan Rapat Orang Tua/Wali Siswa", "Kepada Yth.", "Bapak/Ibu Orang Tua/Wali Siswa Kelas XII", "di Tempat", "Dengan hormat,", "Sehubungan dengan persiapan pelaksanaan ujian akhir sekolah tahun pelajaran 2026/2027, kami mengundang Bapak/Ibu Orang Tua/Wali untuk hadir pada rapat yang akan dilaksanakan pada:", "Hari/Tanggal\t: Sabtu, 22 Mei 2027", "Waktu\t: 09.00 WIB sampai selesai", "Tempat\t: Aula SMK Nusantara", "Acara\t: Sosialisasi jadwal dan tata tertib ujian akhir", "Mengingat pentingnya acara tersebut, kami mohon Bapak/Ibu dapat hadir tepat waktu. Demikian undangan ini kami sampaikan. Atas perhatian dan kehadiran Bapak/Ibu, kami ucapkan terima kasih.", "Medan, 14 Mei 2027", "Kepala Sekolah,", "", "", "Drs. Ahmad Fauzi, M.Pd.", "NIP 19700101 199501 1 001"], "rubric": [["Kop surat dengan garis bawah ganda", 25], ["Nomor, lampiran, perihal sejajar (Tab)", 25], ["Isi surat: Justify, indent, spasi tepat", 25], ["Blok tanda tangan tabel tanpa border", 25]]}, {"no": 7, "title": "Header, Footer & Nomor Halaman", "goal": "Membuat Header dan Footer, menyisipkan nomor halaman otomatis, serta mengatur halaman pertama berbeda.", "menu": "Insert → Header, Footer, Page Number; Header & Footer → Different First Page.", "steps": ["Ketik naskah laporan dan simpan sebagai Latihan7.docx. Judul 16 pt Bold Center, subjudul Italic Center, isi Justify spasi 1,5 dengan First Line Indent 1,25 cm.", "Klik Insert → Header → Blank. Ketik nama sekolah di kiri, tekan Tab dua kali, lalu ketik judul laporan di kanan (rata kanan).", "Beri garis bawah header: Home → Borders → Bottom Border.", "Klik Insert → Footer → Blank. Pilih Insert → Page Number → Current Position → Plain Number.", "Ketik “Halaman ” sebelum nomor, lalu sisipkan “ dari ” dan Field NumPages (Insert → Quick Parts → Field).", "Beri garis atas footer (Top Border), pusatkan (Center), lalu tutup dengan Close Header and Footer."], "tips": "Double-click area header atau footer untuk mengeditnya, double-click area isi untuk kembali. Nomor halaman bersifat field, jadi berubah otomatis saat halaman bertambah.", "raw": ["LAPORAN KEGIATAN KUNJUNGAN INDUSTRI", "Kunjungan Industri ke PT Kreasi Digital Medan", "Kunjungan industri dilaksanakan pada hari Selasa, 11 Mei 2027 dan diikuti oleh seluruh siswa kelas XI jurusan Multimedia. Kegiatan bertujuan memperkenalkan alur kerja produksi konten digital di dunia industri.", "Selama kunjungan, siswa mengamati proses penyuntingan video, perancangan grafis, dan pengelolaan media sosial perusahaan. Narasumber dari perusahaan menjelaskan kebutuhan keterampilan yang dicari industri saat ini.", "Setelah kegiatan, siswa diminta menyusun laporan dan mempresentasikannya di depan kelas sebagai bahan evaluasi dan refleksi bersama guru pembimbing.", "Header: SMK Nusantara\tLaporan Kunjungan Industri", "Footer: Halaman 1 dari 3"], "rubric": [["Header kiri dan kanan dengan Tab", 30], ["Garis pembatas header dan footer", 20], ["Nomor halaman otomatis format “Halaman X dari Y”", 30], ["Isi laporan terformat rapi", 20]]}, {"no": 8, "title": "Daftar Bernomor & Multilevel List", "goal": "Membuat daftar bernomor dan multilevel list (1. / a.) pada struktur organisasi dengan indentasi bertingkat.", "menu": "Home → Numbering, Multilevel List; Tab / Shift+Tab untuk naik turun level.", "steps": ["Ketik naskah dan simpan sebagai Latihan8.docx. Judul Bold Center 16 pt, paragraf pengantar Justify.", "Blok seluruh daftar (mulai “Pengurus Inti”) lalu klik Home → Multilevel List → pilih format 1. / a. / i.", "Tempatkan kursor di awal “Ketua”, tekan Tab agar turun menjadi level 2 (a.). Lakukan juga untuk anggota lain.", "Tekan Shift+Tab pada “Seksi-Seksi” dan “Pembina” agar kembali ke level 1.", "Buka Define New Multilevel List untuk mengatur Number position 0 cm dan Text indent 1 cm per level.", "Tebalkan teks level 1 dan periksa bahwa penomoran melanjutkan 1, 2, 3 secara otomatis."], "tips": "Jika nomor tidak melanjutkan, klik kanan nomor → Continue Numbering. Gunakan Restart at 1 untuk memulai ulang urutan.", "raw": ["STRUKTUR ORGANISASI OSIS SMK NUSANTARA", "Organisasi Siswa Intra Sekolah (OSIS) dipimpin oleh pengurus inti yang dibantu seksi-seksi dan dibina oleh guru pembina. Susunan lengkap pengurus periode 2026/2027 adalah sebagai berikut.", "Pengurus Inti", "Ketua", "Wakil Ketua", "Sekretaris", "Bendahara", "Seksi-Seksi", "Seksi Ketakwaan", "Seksi Olahraga", "Seksi Kesenian", "Seksi Hubungan Masyarakat", "Pembina", "Kepala Sekolah", "Guru Pembina OSIS"], "rubric": [["Multilevel List dua tingkat (1. dan a.)", 40], ["Level turun/naik tepat dengan Tab/Shift+Tab", 30], ["Indentasi bertingkat rapi", 20], ["Penomoran melanjutkan otomatis", 10]]}, {"no": 9, "title": "Tabel Lanjutan (Merge, Sort, Rumus)", "goal": "Menggabungkan sel (Merge Cells), mengurutkan data (Sort), memakai rumus =SUM(LEFT), dan memberi style tabel.", "menu": "Insert → Table; Table Layout → Merge Cells, Sort, Formula.", "steps": ["Ketik judul dan konversi baris data menjadi tabel (Insert → Table → Convert Text to Table, pemisah ( | )). Simpan sebagai Latihan9.docx.", "Tambahkan satu kolom di kanan (Layout → Insert Right) berjudul “Total”, dan baris judul tambahan di atas header.", "Gabungkan sel “Januari” dan “Februari” di baris atas menjadi “Penjualan (unit)” dengan Merge Cells. Gabungkan juga sel No, Barang, dan Total secara vertikal.", "Isi kolom Total memakai Layout → Formula → =SUM(LEFT). Tambahkan baris “Jumlah” dengan =SUM(ABOVE).", "Blok baris data (bukan header) lalu Layout → Sort, urutkan kolom Total secara Descending.", "Beri style Grid Table 4 – Accent 1, rata tengah header, rata kanan angka."], "tips": "Tekan F9 setelah mengubah angka agar rumus (field) diperbarui. Rumus Word tidak otomatis seperti Excel.", "raw": ["REKAPITULASI PENJUALAN KOPERASI SEKOLAH", "Semester Genap Tahun Pelajaran 2026/2027", "No | Barang | Januari | Februari", "1 | Buku Tulis | 120 | 135", "2 | Pulpen | 200 | 180", "3 | Penghapus | 90 | 75", "Total tiap barang dan Jumlah dihitung memakai rumus =SUM(LEFT) dan =SUM(ABOVE)."], "rubric": [["Merge Cells pada header bertingkat", 30], ["Rumus SUM benar (Total dan Jumlah)", 30], ["Data terurut menurun berdasar Total", 20], ["Style dan perataan tabel", 20]]}, {"no": 10, "title": "Styles & Daftar Isi Otomatis", "goal": "Menggunakan Heading Styles dan membuat Daftar Isi (Table of Contents) otomatis dengan leader titik dan nomor halaman.", "menu": "Home → Styles; References → Table of Contents.", "steps": ["Ketik naskah dan simpan sebagai Latihan10.docx. Judul dokumen Bold Center 18 pt.", "Beri style Heading 1 pada baris “BAB I” dan “BAB II”, serta Heading 2 pada subbab (1.1, 1.2, 2.1).", "Ubah Heading 1: Arial 15 pt Bold, biru, Center. Ubah Heading 2: Arial 12,5 pt Bold, biru (klik kanan style → Modify).", "Isi paragraf: Normal, Justify, First Line Indent 1,25 cm, spasi 1,5.", "Letakkan kursor di bawah judul, klik References → Table of Contents → Automatic Table 1 (atau Custom dengan leader titik).", "Tambahkan Page Break sebelum BAB II, lalu klik Update Table → Update entire table."], "tips": "Selalu memakai Heading Styles, bukan sekadar membesarkan huruf, agar daftar isi bisa terbentuk otomatis.", "raw": ["PANDUAN SINGKAT PEMBUATAN LAPORAN", "BAB I PENDAHULUAN", "1.1 Latar Belakang", "Laporan adalah sarana menyampaikan hasil kegiatan secara tertulis dan sistematis. Laporan yang baik disusun dengan struktur jelas sehingga mudah dibaca dan ditelusuri oleh pembaca.", "1.2 Tujuan", "Tujuan panduan ini adalah membantu siswa menyusun laporan dengan format yang konsisten, mulai dari judul bab, subbab, hingga daftar isi yang dibuat otomatis.", "BAB II PEMBAHASAN", "2.1 Persiapan", "Persiapan meliputi pengumpulan data, penentuan kerangka laporan, dan pengaturan halaman sebelum penulisan isi dimulai."], "rubric": [["Heading 1 dan Heading 2 diterapkan", 30], ["Style dimodifikasi (font, warna, perataan)", 20], ["Daftar Isi otomatis dengan leader dan nomor halaman", 40], ["Page Break dan Update Table", 10]]}, {"no": 11, "title": "Footnote & Daftar Pustaka", "goal": "Menyisipkan catatan kaki (Footnote), superscript, dan menyusun Daftar Pustaka dengan hanging indent.", "menu": "References → Insert Footnote; Home → Paragraph → Hanging.", "steps": ["Ketik naskah dan simpan sebagai Latihan11.docx. Judul Bold Center 17 pt, isi Justify spasi 1,5 dengan First Line Indent.", "Hapus penanda [1] dan [2], lalu letakkan kursor di titik tersebut dan klik References → Insert Footnote.", "Ketik isi catatan kaki sesuai naskah “Catatan kaki”, lalu hapus baris catatan kaki dari badan teks.", "Atur font catatan kaki 10 pt (Footnote Text style) dan pastikan nomornya superscript.", "Judul “DAFTAR PUSTAKA” Bold Center. Urutkan entri berdasarkan abjad nama penulis.", "Beri setiap entri Hanging Indent 1,25 cm dan perataan Justify."], "tips": "Footnote otomatis berpindah ke halaman yang sama dengan referensinya. Gunakan Insert Endnote jika ingin catatan di akhir dokumen.", "raw": ["Pentingnya Literasi Digital", "Literasi digital menjadi keterampilan wajib pada abad ke-21.[1] Siswa dituntut mampu mencari, menyaring, dan menilai informasi dari berbagai sumber daring secara kritis.", "Selain itu, kemampuan menggunakan perangkat lunak pengolah kata menjadi dasar penting bagi penulisan karya ilmiah di sekolah.[2]", "Catatan kaki 1: Kemendikbud, Panduan Literasi Digital, 2021, hlm. 4.", "Catatan kaki 2: Rahman, A., Literasi di Era Digital, 2022, hlm. 15.", "DAFTAR PUSTAKA", "Rahman, Ahmad. 2022. Literasi di Era Digital. Bandung: Pustaka Cendekia.", "Kemendikbud. 2021. Panduan Literasi Digital. Jakarta: Kementerian Pendidikan dan Kebudayaan."], "rubric": [["Footnote disisipkan dengan References", 40], ["Ukuran dan format catatan kaki", 20], ["Daftar Pustaka urut abjad", 20], ["Hanging Indent pada entri pustaka", 20]]}, {"no": 12, "title": "Mail Merge (Surat Massal)", "goal": "Membuat surat massal dengan Mail Merge: menyisipkan Merge Field dari sumber data dan menghasilkan banyak surat sekaligus.", "menu": "Mailings → Start Mail Merge, Select Recipients, Insert Merge Field, Finish & Merge.", "steps": ["Ketik surat templat (baris 0 sampai 3) dan simpan sebagai Latihan12.docx. Judul Bold Center dengan garis ganda di bawahnya.", "Buat sumber data: tabel kecil di dokumen baru berisi data penerima (Nama_Orang_Tua, Nama_Siswa, Kelas, Tanggal). Simpan sebagai Penerima.docx.", "Pada surat: Mailings → Start Mail Merge → Letters. Select Recipients → Use an Existing List → Penerima.docx.", "Hapus penanda «…» lalu ganti dengan Insert Merge Field sesuai nama kolom.", "Klik Preview Results untuk memeriksa tiap penerima.", "Klik Finish & Merge → Edit Individual Documents → All untuk menghasilkan surat satu per penerima."], "tips": "Nama kolom sumber data tidak boleh mengandung spasi (gunakan garis bawah) agar field terbaca benar.", "raw": ["SMK NUSANTARA - SURAT PEMBERITAHUAN", "Kepada Yth. «Nama_Orang_Tua»", "Orang tua/wali dari «Nama_Siswa» kelas «Kelas»", "Dengan hormat, kami memberitahukan bahwa putra/putri Bapak/Ibu akan tampil pada Pentas Seni Sekolah yang diselenggarakan pada «Tanggal». Mohon kehadiran Bapak/Ibu untuk memberikan dukungan.", "Data penerima", "Nama_Orang_Tua | Nama_Siswa | Kelas | Tanggal", "Bapak Ahmad Siregar | Dina Siregar | XI MM 1 | 28 Mei 2027", "Ibu Sri Wahyuni | Rizky Pratama | XI MM 2 | 28 Mei 2027", "Bapak Budi Hasibuan | Putri Hasibuan | XI MM 1 | 29 Mei 2027"], "rubric": [["Sumber data penerima benar", 25], ["Merge Field disisipkan di posisi tepat", 35], ["Preview Results diperiksa", 15], ["Finish & Merge menghasilkan surat massal", 25]]}];

r=>{const d=r.slice(3,6).map(s=>s.split(' | ')).map(c=>[c[1],+c[2],+c[3],+c[2]+ +c[3]]).sort((a,b)=>b[3]-a[3]);const s=k=>d.reduce((a,x)=>a+x[k],0);const th='style="background:#2B579A;color:#fff;text-align:center"';
return `<p style="text-align:center;font:bold 17px 'Times New Roman'">${r[0]}</p><p style="text-align:center;margin-bottom:12px">${r[1]}</p><table class="t5"><tr ${th}><th rowspan=2>No</th><th rowspan=2>Barang</th><th colspan=2>Penjualan (unit)</th><th rowspan=2>Total</th></tr><tr ${th}><th>Januari</th><th>Februari</th></tr>`+d.map((x,i)=>`<tr><td align=center>${i+1}</td><td>${x[0]}</td><td align=right>${x[1]}</td><td align=right>${x[2]}</td><td align=right><b>${x[3]}</b></td></tr>`).join('')+`<tr style="background:#dbe7f7;font-weight:bold"><td colspan=2 align=center>Jumlah</td><td align=right>${s(1)}</td><td align=right>${s(2)}</td><td align=right>${s(3)}</td></tr></table><p style="font-size:11px;margin-top:8px">Data diurutkan menurun berdasarkan Total (Layout → Sort).</p>`},
r=>{const P=[1,1,2,3,3],H=[1,2,4,6,7];return `<p style="text-align:center;font:bold 18px 'Times New Roman';margin-bottom:6px">${r[0]}</p><p style="text-align:center;font-weight:bold;margin:6px 0 4px">DAFTAR ISI</p>`+H.map((i,k)=>`<div class="ld" style="padding-left:${/^BAB/.test(r[i])?0:1.2}cm"><span>${r[i]}</span><i></i><span>${P[k]}</span></div>`).join('')+r.slice(1).map(t=>/^BAB/.test(t)?`<p style="font:bold 15px Arial;color:#2B579A;margin:14px 0 4px;text-align:center">${t}</p>`:/^\d\.\d/.test(t)?`<p style="font:bold 12.5px Arial;color:#2B579A;margin:8px 0 2px">${t}</p>`:`<p style="${J};text-indent:1.25cm;line-height:1.5">${t}</p>`).join('')},
r=>{const fn=[3,4].map(i=>r[i].replace(/^Catatan kaki \d: /,''));const sup=t=>t.replace(/\[(\d)\]/g,'<sup style="color:#2B579A">$1</sup>');
return `<p style="text-align:center;font:bold 17px 'Times New Roman';margin-bottom:10px">${r[0]}</p><p style="${J};text-indent:1.25cm;line-height:1.5;margin-bottom:6px">${sup(r[1])}</p><p style="${J};text-indent:1.25cm;line-height:1.5">${sup(r[2])}</p><div style="margin-top:50px;border-top:1px solid #333;width:40%;padding-top:3px;font-size:11px">${fn.map((t,i)=>`<p><sup>${i+1}</sup> ${t}</p>`).join('')}</div><p style="text-align:center;font-weight:bold;margin:26px 0 6px">${r[5]}</p>`+[6,7].map(i=>`<p style="padding-left:1.25cm;text-indent:-1.25cm;${J};margin-bottom:4px">${r[i]}</p>`).join('')},
r=>{const d=r.slice(6,9).map(s=>s.split(' | '));const v={Nama_Orang_Tua:d[0][0],Nama_Siswa:d[0][1],Kelas:d[0][2],Tanggal:d[0][3]};const f=t=>t.replace(/«(\w+)»/g,(_,k)=>`<mark style="background:#fff3a0">${v[k]}</mark>`);
return `<p style="text-align:center;font:bold 16px 'Times New Roman';border-bottom:3px double #000;padding-bottom:4px;margin-bottom:12px">${r[0]}</p><p>${f(r[1])}</p><p style="margin-bottom:10px">${f(r[2])}</p><p style="${J};text-indent:1.25cm;line-height:1.5">${f(r[3])}</p><p style="margin:16px 0 4px;font-weight:bold">${r[4]} (sumber data)</p><table class="t5" style="font-size:11px"><tr style="background:#2B579A;color:#fff">${r[5].split(' | ').map(h=>`<th>${h}</th>`).join('')}</tr>${d.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table><p style="font-size:11px;margin-top:8px">Hasil Finish &amp; Merge: ${d.length} surat, masing-masing berisi data penerima berbeda.</p>`}
];
const before=m=>m.raw.map(l=>`<p style="white-space:pre-wrap;min-height:1.35em;margin-bottom:6px">${e(l).replace(/\t/g,'<span class="tg"></span>')}</p>`).join('');
const paper=(m,k)=>k==='b'?`<div class="paper cal" style="font-size:14px"><span class="badge" style="background:#d97706">BEFORE</span>${before(m)}</div>`:`<div class="paper"><span class="badge" style="background:#16a34a">AFTER</span>${R[m.no-1](m.raw)}</div>`;
let cur=0,view='b',st={};try{st=JSON.parse(localStorage.getItem('lmsword')||'{}')}catch(x){}
const save=()=>{try{localStorage.setItem('lmsword',JSON.stringify(st))}catch(x){}};
const $=id=>document.getElementById(id);
const toast=t=>{const o=$('toast');o.textContent=t;o.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>o.classList.add('hidden'),2400)};
const score=i=>M[i].rubric.reduce((a,r,k)=>a+(st['r'+i+'-'+k]?r[1]:0),0);
function stats(){let d=0,t=0,s=0,n=0;M.forEach((m,i)=>{m.steps.forEach((_,j)=>{t++;if(st[i+'-'+j])d++});if(st['d'+i]){s+=score(i);n++}});
 const p=Math.round(d/t*100);$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('avg').textContent=n?Math.round(s/n):'–'}
function nav(){$('nav').innerHTML=M.map((m,i)=>{const d=m.steps.filter((_,j)=>st[i+'-'+j]).length;return `<button class="nav-btn ${i===cur?'on':''}" data-i="${i}">${st['d'+i]?'✅':'📝'} Latihan ${m.no}: ${m.title}<span class="block text-xs opacity-70">${d}/${m.steps.length} langkah${st['d'+i]?' · skor '+score(i):''}</span></button>`}).join('')}
function render(){const m=M[cur],i=cur;
 const tabs=[['b','① Before (teks awal)'],['a','② After (hasil)'],['c','⇄ Bandingkan']];
 $('main').innerHTML=`<div class="card p-4 mb-4"><h2 class="text-lg font-bold" style="color:var(--blue)">Latihan ${m.no}: ${m.title}</h2>
 <p class="text-sm mt-1">🎯 ${m.goal}</p><p class="text-xs mt-1" style="color:var(--mute)">Menu: ${m.menu}</p>
 <p class="text-xs mt-2 px-3 py-2 rounded-lg" style="background:var(--soft)">🔒 Teks tidak dapat disalin. Ketik ulang naskah <b>Before</b> di Microsoft Word, lalu format agar sama dengan <b>After</b>. Tanda tab pada naskah = tekan Tab sekali.</p></div>
 <div class="flex flex-wrap gap-2 mb-3">${tabs.map(t=>`<button class="tab ${view===t[0]?'on':''}" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>
 <div class="grid ${view==='c'?'':'xl:grid-cols-[1fr_340px]'} gap-4">
  <div class="sheet">${view==='c'?`<div class="grid md:grid-cols-2 gap-4"><div class="sheet">${paper(m,'b')}</div><div class="sheet">${paper(m,'a')}</div></div>`:paper(m,view)}</div>
  <div class="space-y-4"><div class="card p-4"><h3 class="font-semibold mb-2 text-sm">✅ Langkah praktikum</h3><ul class="space-y-2">${m.steps.map((s,j)=>`<li><label class="flex gap-2 text-sm cursor-pointer"><input type="checkbox" class="mt-1 accent-[#2B579A]" data-k="${i}-${j}" ${st[i+'-'+j]?'checked':''}><span>${s}</span></label></li>`).join('')}</ul>
  <p class="text-xs mt-3 p-2 rounded" style="background:#fff8e1;color:#7a5b00">💡 ${m.tips}</p></div>
  <div class="card p-4"><h3 class="font-semibold mb-2 text-sm">📊 Penilaian mandiri</h3>${m.rubric.map((r,k)=>`<label class="flex gap-2 text-sm py-1 cursor-pointer"><input type="checkbox" class="mt-1 accent-[#2B579A]" data-k="r${i}-${k}" ${st['r'+i+'-'+k]?'checked':''}><span class="flex-1">${r[0]}</span><b>${r[1]}</b></label>`).join('')}
  <div class="flex justify-between items-center mt-3"><span class="text-sm">Skor: <b id="sc">${score(i)}</b>/100</span><button id="fin" class="px-3 py-2 rounded-lg text-white text-sm" style="background:${st['d'+i]?'#16a34a':'#2B579A'}">${st['d'+i]?'✔ Selesai':'Tandai selesai'}</button></div></div></div></div>
 <div class="flex justify-between mt-4"><button class="go card px-4 py-2 text-sm ${cur?'':'invisible'}" data-d="-1">← Sebelumnya</button><button class="go card px-4 py-2 text-sm ${cur<M.length-1?'':'invisible'}" data-d="1">Berikutnya →</button></div>`;
 nav();stats()}
const inp=t=>{const n=t&&t.nodeType===1?t:t&&t.parentElement;return n&&n.closest&&n.closest('input,textarea')};
['copy','cut','contextmenu','dragstart','selectstart'].forEach(v=>document.addEventListener(v,x=>{if(!inp(x.target))x.preventDefault()}));
document.addEventListener('keydown',x=>{if((x.ctrlKey||x.metaKey)&&'cxaspu'.includes(x.key.toLowerCase())&&!inp(x.target))x.preventDefault()});
document.addEventListener('click',x=>{const t=x.target;let b;
 if(b=t.closest('.nav-btn')){cur=+b.dataset.i;render();scrollTo(0,0);if(innerWidth<1024)$('nav').classList.add('hidden')}
 else if(b=t.closest('.tab')){view=b.dataset.v;render()}
 else if(b=t.closest('.go')){cur+=+b.dataset.d;render();scrollTo(0,0)}
 else if(t.id==='menuBtn')$('nav').classList.toggle('hidden');
 else if(t.id==='fin'){st['d'+cur]=!st['d'+cur];save();render();toast(st['d'+cur]?'Latihan ditandai selesai. Skor '+score(cur):'Status selesai dibatalkan')}});
document.addEventListener('change',x=>{const k=x.target.dataset&&x.target.dataset.k;if(k){st[k]=x.target.checked;save();if(k[0]==='r'){$('sc').textContent=score(cur)}nav();stats()}});
$('nm').value=st.name||'';$('nm').addEventListener('input',x=>{st.name=x.target.value;save()});
render();
</script>
</body>
