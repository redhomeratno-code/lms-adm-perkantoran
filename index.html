<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LMS Praktikum Microsoft Word</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--blue:#2B579A;--soft:#e8eef8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--ink:#f3f4f6;--mute:#9ca3af;--line:#374151;--soft:#1e2a44}}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
@media print{body{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem}
.nav-btn{display:block;width:100%;text-align:left;padding:.55rem .75rem;border-radius:.5rem;font-size:.88rem}
.nav-btn.on{background:var(--blue);color:#fff}.nav-btn:not(.on):hover{background:var(--soft)}
.tab{padding:.45rem .9rem;border-radius:.5rem;font-size:.85rem;border:1px solid var(--line)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sheet{overflow-x:auto}.chip{padding:.4rem .8rem;border-radius:99px;font-size:.8rem;border:1px solid var(--line)}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}.ed{-webkit-user-select:text;user-select:text;outline:2px solid #2B579A}
.paper{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;font-size:13px;line-height:1.35;padding:38px 42px;aspect-ratio:210/297;width:100%;min-width:360px;max-width:600px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid #d1d5db;position:relative}
.sheet{min-width:0}.a4{width:595px;min-width:0;max-width:none}input[type=checkbox]{width:1.15rem;height:1.15rem;flex:none}@media(max-width:1023px){input,textarea,select{font-size:16px!important}.nav-btn{padding:.7rem .8rem}.tab,.chip{padding:.55rem .9rem}}.cal{font-family:Calibri,Carlito,Arial,sans-serif}
.paper p{margin:0}.paper .tg{display:inline-block;width:2.4em}
.badge{position:absolute;top:8px;right:10px;font:600 10px Arial;color:#fff;padding:2px 8px;border-radius:99px}
.ld{display:flex;align-items:baseline;gap:4px;margin:2px 0}.ld i{flex:1;border-bottom:2px dotted #333}
.ip{display:inline-block;width:4.2em;text-align:right}.un{min-width:4.5em;text-align:right}
.kv{display:grid;margin:1px 0}.box5{background:#2B579A;color:#fff;font:600 11px Arial;padding:8px 10px;border-radius:6px}
.dc::first-letter{float:left;font-size:44px;line-height:38px;padding:2px 6px 0 0;font-weight:700;color:#2B579A}
.cols{column-count:2;column-gap:26px;column-rule:1px solid #222;text-align:justify;font-size:12.5px}
table.t5{border-collapse:collapse;width:100%;font-size:12px}table.t5 td,table.t5 th{border:1px solid #4472C4;padding:3px 6px}
</style>
</head>
<body>
<header class="text-white" style="background:#2B579A">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-3">
    <div class="w-10 h-10 rounded-lg bg-white text-[#2B579A] font-bold text-xl flex items-center justify-center">W</div>
    <div class="flex-1"><h1 class="text-lg md:text-xl font-bold">LMS Praktikum Microsoft Word</h1><p class="text-xs md:text-sm text-blue-100">Ketik ulang teks Before, format hingga sama dengan After.</p></div>
  </div>
</header>
<div class="max-w-7xl mx-auto px-4 py-5 grid lg:grid-cols-[250px_1fr] gap-5">
  <aside><div class="card p-3 lg:sticky lg:top-4">
    <div class="sx hidden lg:block"><label class="text-xs" style="color:var(--mute)">Nama siswa</label>
    <input id="nm" class="w-full mt-1 mb-3 px-3 py-2 rounded-lg border text-sm" style="background:var(--bg);border-color:var(--line);color:var(--ink)" placeholder="Tulis nama Anda"></div>
    <button id="menuBtn" class="lg:hidden w-full text-left font-semibold px-1 py-1">☰ Daftar Latihan & Progres <span id="pm" class="float-right text-xs opacity-70"></span></button>
    <nav id="nav" class="hidden lg:block space-y-1 mt-2"></nav>
    <div class="mt-3 pt-3 border-t sx hidden lg:block" style="border-color:var(--line)"><div class="text-xs mb-1" style="color:var(--mute)">Progres: <b id="pct">0%</b> · Rata-rata skor: <b id="avg">–</b></div>
    <div class="h-2 rounded-full" style="background:var(--line)"><div id="bar" class="h-2 rounded-full transition-all" style="background:var(--blue);width:0"></div></div></div>
  </div></aside>
  <main id="main" class="min-w-0"></main>
</div>
<div id="toast" class="fixed bottom-20 md:bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-white text-sm hidden" style="background:#1f2937;z-index:50"></div>
<script>
const M=[{"no": 1, "title": "Formatting Font & Paragraf Dasar", "goal": "Mengatur jenis huruf (Font), ukuran, gaya cetak (Bold, Italic, Underline), warna teks, perataan paragraf (Align Left, Center, Right, Justify), dan spasi baris (Line Spacing).", "menu": "Tab Home → grup Font dan grup Paragraph.", "steps": ["Buka dokumen baru, atur kertas A4 dengan margin Normal (Layout → Margins → Normal). Simpan sebagai Latihan1.docx.", "Salin naskah dari file bahan latihan lalu tempel (Paste) ke dokumen.", "Judul “PENGUMUMAN RESMI”: Font Arial Black, ukuran 18 pt, Bold, warna biru (Blue, Accent 1), perataan Center.", "Subjudul baris kedua: Font Calibri, ukuran 12 pt, Italic, Center. Beri garis bawah (Underline) hanya pada kata “Pekan Literasi”.", "Seluruh isi pengumuman: Font Times New Roman, ukuran 12 pt, perataan Justify, Line Spacing 1,5.", "Pada paragraf isi, tebalkan (Bold) tanggal pelaksanaan dan beri warna merah pada kata “wajib”.", "Baris “Hormat kami,” dan “Panitia Pekan Literasi” diratakan ke kanan (Align Right). Nama panitia di-Bold.", "Beri Paragraph Spacing After 6 pt pada semua paragraf isi (Layout → Spacing → After). Periksa tampilan di Print Preview."], "tips": "Gunakan Ctrl+B (Bold), Ctrl+I (Italic), Ctrl+U (Underline), Ctrl+E (Center), Ctrl+R (Right), Ctrl+J (Justify), Ctrl+L (Left). Jika format tidak diinginkan, tekan Ctrl+Space untuk membersihkan format huruf.", "raw": ["PENGUMUMAN RESMI", "Pekan Literasi SMK Nusantara Tahun Pelajaran 2026/2027", "Diberitahukan kepada seluruh siswa bahwa sekolah akan menyelenggarakan Pekan Literasi pada tanggal 17 sampai 21 Mei 2027 di lingkungan SMK Nusantara. Kegiatan ini bertujuan menumbuhkan minat baca dan budaya menulis di kalangan siswa.", "Rangkaian kegiatan meliputi lomba membaca puisi, bedah buku, bursa buku murah, dan pameran karya tulis siswa. Seluruh siswa wajib hadir mengenakan seragam lengkap dan membawa satu buku bacaan favorit masing-masing.", "Siswa yang berminat mengikuti lomba dapat mendaftar kepada wali kelas paling lambat tanggal 10 Mei 2027. Pendaftaran tidak dipungut biaya.", "Demikian pengumuman ini disampaikan untuk dilaksanakan dengan penuh tanggung jawab. Atas perhatian dan kerja sama seluruh siswa, kami ucapkan terima kasih.", "Hormat kami,", "Panitia Pekan Literasi"], "rubric": [["Font, ukuran, dan warna judul sesuai", 20], ["Gaya cetak (Bold/Italic/Underline) tepat sasaran", 20], ["Perataan paragraf sesuai (Center, Justify, Right)", 30], ["Line Spacing 1,5 dan Spacing After diterapkan", 30]]}, {"no": 2, "title": "Indentasi & Border/Shading", "goal": "Mengatur First Line Indent, Hanging Indent, Left/Right Indent, serta memberikan bingkai (Borders) dan warna latar paragraf (Shading).", "menu": "Home → Paragraph (peluncur dialog) → Indents and Spacing; Home → Borders and Shading.", "steps": ["Salin naskah ke dokumen baru, simpan sebagai Latihan2.docx. Atur seluruh teks: Calibri 12 pt.", "Judul “Tata Tertib Perpustakaan Sekolah”: Bold, Center, 14 pt.", "Paragraf pembuka: Justify dan First Line Indent 1,25 cm (Paragraph → Special → First line → 1,25 cm).", "Lima poin ketentuan: beri Hanging Indent 1 cm (Special → Hanging → 1 cm) sehingga angka menjorok ke kiri dan teks baris kedua rata di bawah huruf pertama.", "Paragraf kutipan: atur Left Indent 1,5 cm dan Right Indent 1,5 cm, gaya Italic.", "Blok paragraf kutipan, buka Borders → Borders and Shading → Setting Box, Style garis tunggal, Color biru, Width 1½ pt, Apply to: Paragraph.", "Pada tab Shading, pilih Fill biru muda (Blue, Accent 1, Lighter 80%).", "Paragraf penutup: Left Indent 0, Justify. Beri Border Bottom saja pada judul (garis 2¼ pt)."], "tips": "Ruler (View → Ruler) menampilkan penanda indent: segitiga atas = First Line, segitiga bawah = Hanging, kotak = Left Indent. Menggeser penanda ini adalah cara cepat, tetapi dialog Paragraph lebih presisi.", "raw": ["Tata Tertib Perpustakaan Sekolah", "Perpustakaan sekolah terbuka bagi seluruh siswa setiap hari kerja pukul 07.00 sampai 15.00 WIB. Agar layanan berjalan tertib dan nyaman, setiap pengunjung diharapkan memperhatikan ketentuan berikut ini dengan seksama.", "1. Setiap siswa dapat meminjam paling banyak tiga buku untuk jangka waktu tujuh hari kerja dengan menunjukkan kartu anggota perpustakaan.", "2. Keterlambatan pengembalian buku dikenakan denda sebesar Rp500 per hari untuk setiap buku yang terlambat dikembalikan.", "3. Buku yang hilang atau rusak wajib diganti dengan judul dan edisi yang sama paling lambat dua minggu setelah pelaporan.", "4. Pengunjung dilarang makan, minum, dan berbicara dengan suara keras di dalam ruang baca.", "5. Tas dan barang bawaan harus dititipkan pada loker yang telah disediakan di depan pintu masuk.", "“Buku adalah jendela dunia, dan membaca adalah kunci untuk membukanya. Siapa yang gemar membaca akan menemukan dunia yang tak terbatas.”", "Mari bersama-sama menjaga kenyamanan perpustakaan demi kemajuan seluruh warga sekolah."], "rubric": [["First Line Indent pada paragraf pembuka", 20], ["Hanging Indent pada lima poin ketentuan", 30], ["Left dan Right Indent pada kutipan", 20], ["Border kotak dan Shading pada kutipan", 30]]}, {"no": 3, "title": "Tabulasi (Tabs)", "goal": "Menggunakan Left Tab, Right Tab, Decimal Tab, dan Tab Leader (titik-titik otomatis) untuk menyusun daftar yang rapi dan sejajar.", "menu": "Home → Paragraph → Tabs… (atau klik ruler untuk menaruh tab stop).", "steps": ["Salin naskah ke dokumen baru (tanda tab sudah ada di antara kolom). Simpan sebagai Latihan3.docx.", "Judul “DAFTAR HARGA KANTIN SEKOLAH”: Bold, Center, 14 pt. Sub judul “Bagian A” Left.", "Blok baris daftar makanan (Nasi Goreng s.d. Jus Alpukat). Buka Paragraph → Tabs. Isi Tab stop position 9 cm, Alignment Decimal, Leader 2 (titik-titik). Klik Set.", "Tambahkan Tab kedua pada 15,5 cm, Alignment Right, Leader 1 (tanpa leader) untuk kolom Satuan/Stok. Klik Set lalu OK.", "Pastikan setiap baris memakai tombol Tab satu kali per kolom, bukan Spacebar. Angka harus sejajar tepat pada koma desimal.", "Bagian B “Daftar Isi Modul”: blok baris, buat Tab Right pada 14 cm dengan Leader 2 sehingga nomor halaman rata kanan dengan titik-titik di depannya.", "Bagian C “Riwayat Hidup Singkat”: buat Left Tab pada 4 cm agar titik dua sejajar.", "Tampilkan simbol tersembunyi (Ctrl+Shift+8) untuk memastikan hanya ada satu tanda tab (panah) di setiap kolom."], "tips": "Klik kotak kecil di pojok kiri atas ruler untuk berganti jenis tab (Left, Center, Right, Decimal). Klik pada ruler untuk menaruh tab stop. Seret tab stop keluar dari ruler untuk menghapusnya.", "raw": ["DAFTAR HARGA KANTIN SEKOLAH", "Bagian A. Daftar Makanan dan Minuman", "Nasi Goreng Spesial\t12.500,00\tPorsi", "Mie Ayam Bakso\t10.000,00\tMangkuk", "Es Teh Manis\t3.500,50\tGelas", "Jus Alpukat\t9.000,00\tGelas", "Bagian B. Daftar Isi Modul Praktikum", "Bab 1 Font dan Paragraf\t1", "Bab 2 Indentasi dan Border\t5", "Bab 3 Tabulasi\t9", "Bab 4 Drop Cap dan Kolom\t13", "Bagian C. Riwayat Hidup Singkat", "Nama\t: Rina Aprilia Putri", "Tempat/Tanggal Lahir\t: Medan, 12 Agustus 2009", "Alamat\t: Jalan Pendidikan No. 10, Medan", "Pendidikan\t: SMK Nusantara, Jurusan Multimedia"], "rubric": [["Decimal Tab menyejajarkan koma desimal", 30], ["Tab Leader titik-titik berfungsi (Bagian A dan B)", 30], ["Right Tab pada kolom satuan/nomor halaman", 20], ["Tidak memakai Spacebar untuk perataan", 20]]}, {"no": 4, "title": "Drop Cap & Kolom Koran", "goal": "Membuat efek huruf besar di awal paragraf (Drop Cap: Dropped dan In Margin) dan membagi teks menjadi 2 atau 3 kolom dengan garis pemisah (Line Between).", "menu": "Insert → Drop Cap; Layout → Columns → More Columns.", "steps": ["Salin naskah artikel ke dokumen baru. Simpan sebagai Latihan4.docx. Atur isi artikel Times New Roman 12 pt, Justify.", "Judul artikel “Kebun Sekolah Kami” dan baris penulis: Center, judul 20 pt Bold, penulis 11 pt Italic. Biarkan keduanya tetap satu kolom.", "Blok semua paragraf isi (tanpa judul dan nama penulis). Pilih Layout → Columns → Two.", "Buka Layout → Columns → More Columns. Aktifkan Line Between, atur Spacing 1 cm, pastikan Apply to: Selected text.", "Klik paragraf pertama, pilih Insert → Drop Cap → Dropped. Pada Drop Cap Options atur Lines to drop 3, Distance from text 0,2 cm.", "Salin hasil ke halaman baru. Ubah menjadi Three Columns dan gunakan Drop Cap → In Margin pada paragraf pertama untuk membandingkan.", "Beri Column Break (Ctrl+Shift+Enter) sebelum paragraf “Dampak bagi Lingkungan” agar kolom kedua dimulai dari judul bagian tersebut.", "Periksa agar kolom seimbang di akhir artikel (Layout → Breaks → Continuous setelah teks)."], "tips": "Jika teks tidak terbagi ke kolom seperti harapan, pastikan Anda memblok teks sebelum membagi kolom, atau sisipkan Section Break (Continuous) agar bagian judul tidak ikut terbagi.", "raw": ["Kebun Sekolah Kami", "Oleh: Redaksi Buletin SMK Nusantara", "Kebun sekolah kini menjadi tempat belajar yang menyenangkan bagi seluruh siswa. Setiap pagi sebelum jam pelajaran dimulai, kelas-kelas bergiliran menyiram dan merawat tanaman sayur yang telah ditanam sejak awal semester. Sawi, kangkung, dan cabai tumbuh subur di petak-petak kecil yang rapi.", "Selain mengajarkan tanggung jawab, kegiatan berkebun juga melatih kerja sama. Siswa belajar membagi tugas, mencatat pertumbuhan tanaman setiap minggu, dan menghitung hasil panen. Guru mata pelajaran biologi dan matematika memanfaatkan catatan tersebut sebagai bahan pembelajaran langsung di lapangan.", "Dampak bagi Lingkungan. Hasil panen sebagian dijual di kantin sekolah dan sebagian lainnya disumbangkan kepada warga sekitar yang membutuhkan. Uang hasil penjualan dipakai untuk membeli bibit baru dan perlengkapan berkebun. Sampah dedaunan diolah menjadi kompos sehingga lingkungan sekolah tetap bersih.", "Semoga semangat ini terus tumbuh dan menginspirasi sekolah-sekolah lain untuk melakukan hal serupa. Kebun bukan sekadar petak tanah, melainkan ruang kelas terbuka tempat siswa belajar mencintai alam dan bekerja dengan sepenuh hati."], "rubric": [["Teks terbagi dua kolom dengan Line Between", 30], ["Drop Cap Dropped 3 baris pada paragraf pertama", 30], ["Variasi tiga kolom dan Drop Cap In Margin", 20], ["Judul tetap satu kolom dan kolom seimbang", 20]]}, {"no": 5, "title": "Menyisipkan Objek (Insert Objects)", "goal": "Menyisipkan dan mengatur posisi (Text Wrapping) gambar/ilustrasi, Shapes (bagan alur sederhana), WordArt untuk judul menarik, dan Tabel sederhana dalam satu brosur/poster.", "menu": "Tab Insert → Pictures, Shapes, WordArt, Table; tab Picture Format → Wrap Text.", "steps": ["Buka dokumen baru, orientasi Portrait, margin Narrow. Simpan sebagai Latihan5.docx. Salin naskah ke dalam dokumen.", "Judul “BAKTI SOSIAL OSIS 2027”: hapus dari teks biasa, lalu Insert → WordArt, pilih gaya yang jelas terbaca, ubah Text Effects → Transform → Arch Up.", "Insert → Pictures (foto/ilustrasi apa saja bertema kegiatan sosial). Atur Wrap Text → Square, letakkan di sisi kanan paragraf pembuka, ukuran sekitar 5 cm × 4 cm.", "Ubah teks “Hari/Tanggal | Waktu | Kegiatan …” menjadi tabel: blok baris jadwal → Insert → Table → Convert Text to Table, Separate text at: Other ( | ).", "Beri tabel style Grid Table 4 – Accent 1, baris header Bold dan rata tengah. Aktifkan AutoFit → AutoFit to Contents.", "Insert → Shapes: gambar tiga Rounded Rectangle dan dua Right Arrow untuk alur Pendaftaran → Seleksi → Pengumuman.", "Klik kanan setiap shape → Add Text, isi nama tahap. Beri Shape Fill biru dan teks putih. Sejajarkan dengan Align → Align Middle dan Distribute Horizontally.", "Kelompokkan (Group) ketiga shape dan panah agar mudah dipindahkan. Tambahkan Page Border (Design → Page Borders) sebagai sentuhan akhir."], "tips": "Gunakan Layout Options (ikon kecil di sudut gambar) untuk mengganti Text Wrapping dengan cepat. Tahan tombol Shift saat menarik shape agar proporsinya tetap sama, dan tahan Alt agar posisi bergerak lebih halus.", "raw": ["BAKTI SOSIAL OSIS 2027", "OSIS SMK Nusantara mengajak seluruh siswa mengikuti kegiatan bakti sosial di Panti Asuhan Harapan Bangsa. Dalam kegiatan ini siswa akan membersihkan lingkungan panti, membagikan paket sembako kepada warga sekitar, dan bermain bersama anak-anak panti asuhan.", "Setiap siswa yang ikut serta diharapkan membawa sarung tangan, botol minum, dan semangat gotong royong. Kegiatan ini sekaligus menjadi sarana belajar peduli sesama dan bekerja dalam tim.", "Jadwal Kegiatan", "Hari/Tanggal | Waktu | Kegiatan", "Sabtu, 5 Juni 2027 | 07.30 | Kumpul dan pengarahan", "Sabtu, 5 Juni 2027 | 08.30 | Kerja bakti lingkungan panti", "Sabtu, 5 Juni 2027 | 10.30 | Pembagian sembako", "Sabtu, 5 Juni 2027 | 12.00 | Makan siang bersama dan penutupan", "Alur Pendaftaran: Daftar kepada pengurus OSIS, Seleksi Berkas, Pengumuman Peserta.", "Informasi lebih lanjut hubungi sekretariat OSIS di ruang kegiatan siswa."], "rubric": [["WordArt judul dan efek Transform", 20], ["Gambar dengan Text Wrapping Square", 20], ["Tabel hasil konversi dengan style dan header", 30], ["Bagan alur Shapes rapi dan tergrup", 30]]}, {"no": 6, "title": "Pembuatan Surat Resmi & Kop Surat", "goal": "Membuat kop surat institusi dengan garis bawah ganda, mengatur tanggal, nomor surat, lampiran, perihal, isi surat resmi, hingga blok tanda tangan menggunakan tabel tanpa garis (No Border) atau tabulasi.", "menu": "Home → Borders; Insert → Table; Paragraph → Tabs.", "steps": ["Buka dokumen baru ukuran A4 (21 × 29,7 cm), margin Normal, font Times New Roman 12 pt. Simpan sebagai Latihan6.docx.", "Kop surat: nama sekolah 16 pt Bold Center huruf kapital, dua baris alamat 10 pt Center.", "Beri garis bawah kop: Home → Borders → Borders and Shading → Bottom, Style double line (garis ganda) atau Thick-Thin, lebar 3 pt.", "Nomor, Lampiran, dan Perihal: buat Left Tab pada 3 cm. Pada naskah, tanda titik dua sudah diawali tab sehingga titik dua sejajar vertikal.", "Tanggal surat dan “Kepada Yth.” dengan pilihan perataan sesuai kaidah surat resmi (tanggal rata kiri atau kanan sesuai model yang dipilih).", "Isi surat: Justify, First Line Indent 1,25 cm, Line Spacing 1,15. Rincian Hari/Tanggal, Waktu, Tempat menggunakan Left Tab pada 4 cm dan Left Indent 1,25 cm.", "Blok tanda tangan: Insert → Table 2 kolom × 1 baris. Kolom kiri kosong, kolom kanan berisi tempat, tanggal, jabatan, ruang tanda tangan, nama, dan NIP.", "Pilih tabel, klik Borders → No Border agar garis tabel tidak tampak. Gunakan View Gridlines untuk membantu mengatur posisi."], "tips": "Sisipkan Ctrl+Enter pada akhir surat bila ingin lampiran di halaman baru. Untuk surat bernomor otomatis, gunakan Mail Merge saat harus membuat surat serupa untuk banyak penerima.", "raw": ["SMK NUSANTARA", "Jalan Pendidikan No. 10, Medan, Sumatera Utara 20112", "Telepon (061) 555-1234 | Email: info@smknusantara.sch.id", "Nomor\t: 045/SMK-N/V/2027", "Lampiran\t: 1 (satu) berkas", "Perihal\t: Undangan Rapat Orang Tua/Wali Siswa", "Kepada Yth.", "Bapak/Ibu Orang Tua/Wali Siswa Kelas XII", "di Tempat", "Dengan hormat,", "Sehubungan dengan persiapan pelaksanaan ujian akhir sekolah tahun pelajaran 2026/2027, kami mengundang Bapak/Ibu Orang Tua/Wali untuk hadir pada rapat yang akan dilaksanakan pada:", "Hari/Tanggal\t: Sabtu, 22 Mei 2027", "Waktu\t: 09.00 WIB sampai selesai", "Tempat\t: Aula SMK Nusantara", "Acara\t: Sosialisasi jadwal dan tata tertib ujian akhir", "Mengingat pentingnya acara tersebut, kami mohon Bapak/Ibu dapat hadir tepat waktu. Demikian undangan ini kami sampaikan. Atas perhatian dan kehadiran Bapak/Ibu, kami ucapkan terima kasih.", "Medan, 14 Mei 2027", "Kepala Sekolah,", "", "", "Drs. Ahmad Fauzi, M.Pd.", "NIP 19700101 199501 1 001"], "rubric": [["Kop surat dengan garis bawah ganda", 25], ["Nomor, lampiran, perihal sejajar (Tab)", 25], ["Isi surat: Justify, indent, spasi tepat", 25], ["Blok tanda tangan tabel tanpa border", 25]]}, {"no": 7, "title": "Header, Footer & Nomor Halaman", "goal": "Membuat Header dan Footer, menyisipkan nomor halaman otomatis, serta mengatur halaman pertama berbeda.", "menu": "Insert → Header, Footer, Page Number; Header & Footer → Different First Page.", "steps": ["Ketik naskah laporan dan simpan sebagai Latihan7.docx. Judul 16 pt Bold Center, subjudul Italic Center, isi Justify spasi 1,5 dengan First Line Indent 1,25 cm.", "Klik Insert → Header → Blank. Ketik nama sekolah di kiri, tekan Tab dua kali, lalu ketik judul laporan di kanan (rata kanan).", "Beri garis bawah header: Home → Borders → Bottom Border.", "Klik Insert → Footer → Blank. Pilih Insert → Page Number → Current Position → Plain Number.", "Ketik “Halaman ” sebelum nomor, lalu sisipkan “ dari ” dan Field NumPages (Insert → Quick Parts → Field).", "Beri garis atas footer (Top Border), pusatkan (Center), lalu tutup dengan Close Header and Footer."], "tips": "Double-click area header atau footer untuk mengeditnya, double-click area isi untuk kembali. Nomor halaman bersifat field, jadi berubah otomatis saat halaman bertambah.", "raw": ["LAPORAN KEGIATAN KUNJUNGAN INDUSTRI", "Kunjungan Industri ke PT Kreasi Digital Medan", "Kunjungan industri dilaksanakan pada hari Selasa, 11 Mei 2027 dan diikuti oleh seluruh siswa kelas XI jurusan Multimedia. Kegiatan bertujuan memperkenalkan alur kerja produksi konten digital di dunia industri.", "Selama kunjungan, siswa mengamati proses penyuntingan video, perancangan grafis, dan pengelolaan media sosial perusahaan. Narasumber dari perusahaan menjelaskan kebutuhan keterampilan yang dicari industri saat ini.", "Setelah kegiatan, siswa diminta menyusun laporan dan mempresentasikannya di depan kelas sebagai bahan evaluasi dan refleksi bersama guru pembimbing.", "Header: SMK Nusantara\tLaporan Kunjungan Industri", "Footer: Halaman 1 dari 3"], "rubric": [["Header kiri dan kanan dengan Tab", 30], ["Garis pembatas header dan footer", 20], ["Nomor halaman otomatis format “Halaman X dari Y”", 30], ["Isi laporan terformat rapi", 20]]}, {"no": 8, "title": "Daftar Bernomor & Multilevel List", "goal": "Membuat daftar bernomor dan multilevel list (1. / a.) pada struktur organisasi dengan indentasi bertingkat.", "menu": "Home → Numbering, Multilevel List; Tab / Shift+Tab untuk naik turun level.", "steps": ["Ketik naskah dan simpan sebagai Latihan8.docx. Judul Bold Center 16 pt, paragraf pengantar Justify.", "Blok seluruh daftar (mulai “Pengurus Inti”) lalu klik Home → Multilevel List → pilih format 1. / a. / i.", "Tempatkan kursor di awal “Ketua”, tekan Tab agar turun menjadi level 2 (a.). Lakukan juga untuk anggota lain.", "Tekan Shift+Tab pada “Seksi-Seksi” dan “Pembina” agar kembali ke level 1.", "Buka Define New Multilevel List untuk mengatur Number position 0 cm dan Text indent 1 cm per level.", "Tebalkan teks level 1 dan periksa bahwa penomoran melanjutkan 1, 2, 3 secara otomatis."], "tips": "Jika nomor tidak melanjutkan, klik kanan nomor → Continue Numbering. Gunakan Restart at 1 untuk memulai ulang urutan.", "raw": ["STRUKTUR ORGANISASI OSIS SMK NUSANTARA", "Organisasi Siswa Intra Sekolah (OSIS) dipimpin oleh pengurus inti yang dibantu seksi-seksi dan dibina oleh guru pembina. Susunan lengkap pengurus periode 2026/2027 adalah sebagai berikut.", "Pengurus Inti", "Ketua", "Wakil Ketua", "Sekretaris", "Bendahara", "Seksi-Seksi", "Seksi Ketakwaan", "Seksi Olahraga", "Seksi Kesenian", "Seksi Hubungan Masyarakat", "Pembina", "Kepala Sekolah", "Guru Pembina OSIS"], "rubric": [["Multilevel List dua tingkat (1. dan a.)", 40], ["Level turun/naik tepat dengan Tab/Shift+Tab", 30], ["Indentasi bertingkat rapi", 20], ["Penomoran melanjutkan otomatis", 10]]}, {"no": 9, "title": "Tabel Lanjutan (Merge, Sort, Rumus)", "goal": "Menggabungkan sel (Merge Cells), mengurutkan data (Sort), memakai rumus =SUM(LEFT), dan memberi style tabel.", "menu": "Insert → Table; Table Layout → Merge Cells, Sort, Formula.", "steps": ["Ketik judul dan konversi baris data menjadi tabel (Insert → Table → Convert Text to Table, pemisah ( | )). Simpan sebagai Latihan9.docx.", "Tambahkan satu kolom di kanan (Layout → Insert Right) berjudul “Total”, dan baris judul tambahan di atas header.", "Gabungkan sel “Januari” dan “Februari” di baris atas menjadi “Penjualan (unit)” dengan Merge Cells. Gabungkan juga sel No, Barang, dan Total secara vertikal.", "Isi kolom Total memakai Layout → Formula → =SUM(LEFT). Tambahkan baris “Jumlah” dengan =SUM(ABOVE).", "Blok baris data (bukan header) lalu Layout → Sort, urutkan kolom Total secara Descending.", "Beri style Grid Table 4 – Accent 1, rata tengah header, rata kanan angka."], "tips": "Tekan F9 setelah mengubah angka agar rumus (field) diperbarui. Rumus Word tidak otomatis seperti Excel.", "raw": ["REKAPITULASI PENJUALAN KOPERASI SEKOLAH", "Semester Genap Tahun Pelajaran 2026/2027", "No | Barang | Januari | Februari", "1 | Buku Tulis | 120 | 135", "2 | Pulpen | 200 | 180", "3 | Penghapus | 90 | 75", "Total tiap barang dan Jumlah dihitung memakai rumus =SUM(LEFT) dan =SUM(ABOVE)."], "rubric": [["Merge Cells pada header bertingkat", 30], ["Rumus SUM benar (Total dan Jumlah)", 30], ["Data terurut menurun berdasar Total", 20], ["Style dan perataan tabel", 20]]}, {"no": 10, "title": "Styles & Daftar Isi Otomatis", "goal": "Menggunakan Heading Styles dan membuat Daftar Isi (Table of Contents) otomatis dengan leader titik dan nomor halaman.", "menu": "Home → Styles; References → Table of Contents.", "steps": ["Ketik naskah dan simpan sebagai Latihan10.docx. Judul dokumen Bold Center 18 pt.", "Beri style Heading 1 pada baris “BAB I” dan “BAB II”, serta Heading 2 pada subbab (1.1, 1.2, 2.1).", "Ubah Heading 1: Arial 15 pt Bold, biru, Center. Ubah Heading 2: Arial 12,5 pt Bold, biru (klik kanan style → Modify).", "Isi paragraf: Normal, Justify, First Line Indent 1,25 cm, spasi 1,5.", "Letakkan kursor di bawah judul, klik References → Table of Contents → Automatic Table 1 (atau Custom dengan leader titik).", "Tambahkan Page Break sebelum BAB II, lalu klik Update Table → Update entire table."], "tips": "Selalu memakai Heading Styles, bukan sekadar membesarkan huruf, agar daftar isi bisa terbentuk otomatis.", "raw": ["PANDUAN SINGKAT PEMBUATAN LAPORAN", "BAB I PENDAHULUAN", "1.1 Latar Belakang", "Laporan adalah sarana menyampaikan hasil kegiatan secara tertulis dan sistematis. Laporan yang baik disusun dengan struktur jelas sehingga mudah dibaca dan ditelusuri oleh pembaca.", "1.2 Tujuan", "Tujuan panduan ini adalah membantu siswa menyusun laporan dengan format yang konsisten, mulai dari judul bab, subbab, hingga daftar isi yang dibuat otomatis.", "BAB II PEMBAHASAN", "2.1 Persiapan", "Persiapan meliputi pengumpulan data, penentuan kerangka laporan, dan pengaturan halaman sebelum penulisan isi dimulai."], "rubric": [["Heading 1 dan Heading 2 diterapkan", 30], ["Style dimodifikasi (font, warna, perataan)", 20], ["Daftar Isi otomatis dengan leader dan nomor halaman", 40], ["Page Break dan Update Table", 10]]}, {"no": 11, "title": "Footnote & Daftar Pustaka", "goal": "Menyisipkan catatan kaki (Footnote), superscript, dan menyusun Daftar Pustaka dengan hanging indent.", "menu": "References → Insert Footnote; Home → Paragraph → Hanging.", "steps": ["Ketik naskah dan simpan sebagai Latihan11.docx. Judul Bold Center 17 pt, isi Justify spasi 1,5 dengan First Line Indent.", "Hapus penanda [1] dan [2], lalu letakkan kursor di titik tersebut dan klik References → Insert Footnote.", "Ketik isi catatan kaki sesuai naskah “Catatan kaki”, lalu hapus baris catatan kaki dari badan teks.", "Atur font catatan kaki 10 pt (Footnote Text style) dan pastikan nomornya superscript.", "Judul “DAFTAR PUSTAKA” Bold Center. Urutkan entri berdasarkan abjad nama penulis.", "Beri setiap entri Hanging Indent 1,25 cm dan perataan Justify."], "tips": "Footnote otomatis berpindah ke halaman yang sama dengan referensinya. Gunakan Insert Endnote jika ingin catatan di akhir dokumen.", "raw": ["Pentingnya Literasi Digital", "Literasi digital menjadi keterampilan wajib pada abad ke-21.[1] Siswa dituntut mampu mencari, menyaring, dan menilai informasi dari berbagai sumber daring secara kritis.", "Selain itu, kemampuan menggunakan perangkat lunak pengolah kata menjadi dasar penting bagi penulisan karya ilmiah di sekolah.[2]", "Catatan kaki 1: Kemendikbud, Panduan Literasi Digital, 2021, hlm. 4.", "Catatan kaki 2: Rahman, A., Literasi di Era Digital, 2022, hlm. 15.", "DAFTAR PUSTAKA", "Rahman, Ahmad. 2022. Literasi di Era Digital. Bandung: Pustaka Cendekia.", "Kemendikbud. 2021. Panduan Literasi Digital. Jakarta: Kementerian Pendidikan dan Kebudayaan."], "rubric": [["Footnote disisipkan dengan References", 40], ["Ukuran dan format catatan kaki", 20], ["Daftar Pustaka urut abjad", 20], ["Hanging Indent pada entri pustaka", 20]]}, {"no": 12, "title": "Mail Merge (Surat Massal)", "goal": "Membuat surat massal dengan Mail Merge: menyisipkan Merge Field dari sumber data dan menghasilkan banyak surat sekaligus.", "menu": "Mailings → Start Mail Merge, Select Recipients, Insert Merge Field, Finish & Merge.", "steps": ["Ketik surat templat (baris 0 sampai 3) dan simpan sebagai Latihan12.docx. Judul Bold Center dengan garis ganda di bawahnya.", "Buat sumber data: tabel kecil di dokumen baru berisi data penerima (Nama_Orang_Tua, Nama_Siswa, Kelas, Tanggal). Simpan sebagai Penerima.docx.", "Pada surat: Mailings → Start Mail Merge → Letters. Select Recipients → Use an Existing List → Penerima.docx.", "Hapus penanda «…» lalu ganti dengan Insert Merge Field sesuai nama kolom.", "Klik Preview Results untuk memeriksa tiap penerima.", "Klik Finish & Merge → Edit Individual Documents → All untuk menghasilkan surat satu per penerima."], "tips": "Nama kolom sumber data tidak boleh mengandung spasi (gunakan garis bawah) agar field terbaca benar.", "raw": ["SMK NUSANTARA - SURAT PEMBERITAHUAN", "Kepada Yth. «Nama_Orang_Tua»", "Orang tua/wali dari «Nama_Siswa» kelas «Kelas»", "Dengan hormat, kami memberitahukan bahwa putra/putri Bapak/Ibu akan tampil pada Pentas Seni Sekolah yang diselenggarakan pada «Tanggal». Mohon kehadiran Bapak/Ibu untuk memberikan dukungan.", "Data penerima", "Nama_Orang_Tua | Nama_Siswa | Kelas | Tanggal", "Bapak Ahmad Siregar | Dina Siregar | XI MM 1 | 28 Mei 2027", "Ibu Sri Wahyuni | Rizky Pratama | XI MM 2 | 28 Mei 2027", "Bapak Budi Hasibuan | Putri Hasibuan | XI MM 1 | 29 Mei 2027"], "rubric": [["Sumber data penerima benar", 25], ["Merge Field disisipkan di posisi tepat", 35], ["Preview Results diperiksa", 15], ["Finish & Merge menghasilkan surat massal", 25]]}];const SUB=[[{"title": "Poster Kebersihan Kelas", "goal": "Berlatih mengubah ukuran, warna, dan gaya huruf serta perataan tengah dan kanan.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan1-1.docx.", "Judul: Arial 24 pt, Bold, biru, Center.", "Baris kedua: Italic 14 pt, Center. Baris isi: 14 pt, Center.", "Baris “Piket hari ini”: Bold 12 pt, merah, Align Right."], "raw": ["JAGA KEBERSIHAN KELAS", "Kelas yang bersih membuat belajar nyaman", "Buang sampah pada tempatnya.", "Sapu lantai sebelum pulang.", "Rapikan meja dan kursi.", "Piket hari ini: Kelompok 3"], "fmt": ["c b 24 #2B579A A", "c i 14", "c 14", "c 14", "c 14", "r b 12 #c00"], "rubric": [["Ukuran dan warna judul", 30], ["Gaya Bold dan Italic tepat", 30], ["Perataan Center dan Right", 40]]}, {"title": "Resep Nasi Goreng", "goal": "Mengatur spasi baris, First Line Indent, dan gaya subjudul.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan1-2.docx.", "Judul: Bold 18 pt, oranye, Center.", "Dua paragraf utama: Justify, Line Spacing 1,5, First Line Indent 1,25 cm.", "Subjudul “Bahan-bahan” dan “Cara membuat”: Bold + Underline 13 pt."], "raw": ["Resep Nasi Goreng Sederhana", "Nasi goreng adalah hidangan favorit keluarga Indonesia yang mudah dibuat dalam sepuluh menit dengan bahan yang tersedia di dapur.", "Bahan-bahan", "2 piring nasi putih", "2 siung bawang putih", "1 butir telur", "Cara membuat", "Tumis bawang putih hingga harum, masukkan telur dan orak-arik. Tambahkan nasi, kecap, dan garam, lalu aduk rata hingga matang. Sajikan selagi hangat."], "fmt": ["c b 18 #c2410c", "j sp fi", "b u 13", "", "", "", "b u 13", "j sp fi"], "rubric": [["Judul terformat benar", 25], ["Justify dan spasi 1,5", 25], ["First Line Indent", 25], ["Subjudul Bold + Underline", 25]]}, {"title": "Berita Sekolah", "goal": "Menggabungkan semua format dasar dalam satu naskah berita.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan1-3.docx.", "“BERITA SEKOLAH”: Bold 20 pt, merah, Center. Judul berita: Bold 16 pt, Center.", "Tanggal dan tempat: Italic 12 pt, Align Right.", "Dua paragraf isi: Justify, spasi 1,5. “Redaksi”: Bold, Align Right."], "raw": ["BERITA SEKOLAH", "Siswa SMK Nusantara Juarai Lomba Web Design", "Medan, 3 Mei 2027", "Tim web design SMK Nusantara meraih juara pertama pada Lomba Kompetensi Siswa tingkat provinsi yang diikuti dua puluh sekolah.", "Keberhasilan ini diraih berkat latihan intensif selama tiga bulan dan bimbingan guru produktif. Kepala sekolah menyampaikan apresiasi atas prestasi tersebut.", "Redaksi"], "fmt": ["c b 20 #c00", "c b 16", "r i 12", "j sp", "j sp", "r b"], "rubric": [["Kepala berita (judul dan merah)", 30], ["Tanggal rata kanan Italic", 20], ["Isi Justify spasi 1,5", 30], ["Penutup “Redaksi”", 20]]}], [{"title": "Daftar Pustaka (Hanging Indent)", "goal": "Memakai Hanging Indent pada entri daftar pustaka.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan2-1.docx.", "Judul: Bold 14 pt, Center.", "Blok ketiga entri → Paragraph → Special → Hanging → 1 cm.", "Atur perataan Justify pada ketiga entri."], "raw": ["DAFTAR PUSTAKA", "Hasan, Rina. 2021. Dasar-Dasar Pengolahan Kata. Jakarta: Penerbit Cahaya Ilmu.", "Wibowo, Andi. 2022. Mahir Microsoft Office untuk Pelajar. Bandung: Pustaka Mandiri.", "Siregar, Dewi. 2020. Etika Penulisan Karya Ilmiah. Medan: Universitas Terbuka Press."], "fmt": ["c b 14", "hg j", "hg j", "hg j"], "rubric": [["Judul Bold Center", 20], ["Hanging Indent 1 cm", 50], ["Justify", 30]]}, {"title": "Kutipan Bertingkat", "goal": "Mengatur Left/Right Indent dan First Line Indent dalam satu tulisan.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan2-2.docx.", "Judul Bold 16 pt Center. Paragraf biasa: Justify, spasi 1,5, First Line Indent 1,25 cm.", "Paragraf kutipan: Left Indent 1,5 cm dan Right Indent 1,5 cm, Italic, Justify.", "Periksa ketiga paragraf di Ruler agar penanda indent sesuai."], "raw": ["Pentingnya Membaca", "Membaca merupakan jendela pengetahuan. Dengan membaca, seseorang dapat memahami banyak hal tanpa harus mengalaminya sendiri.", "“Orang yang membaca seribu buku akan melihat dunia dengan seribu mata.”", "Kutipan di atas mengingatkan kita bahwa kebiasaan membaca harus dibangun sejak dini, baik di rumah maupun di sekolah."], "fmt": ["c b 16", "j sp fi", "i in j", "j sp fi"], "rubric": [["First Line Indent pada paragraf biasa", 30], ["Left dan Right Indent kutipan", 40], ["Justify dan spasi", 30]]}, {"title": "Kotak Pengumuman (Border & Shading)", "goal": "Memberi Borders dan Shading pada paragraf pengumuman.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan2-3.docx.", "“PERHATIAN!”: Bold 18 pt, merah, Center. Beri Border Box biru dan Shading biru muda.", "Paragraf isi: Justify, dengan Border Box dan Shading yang sama.", "Baris terakhir: Italic Center dengan Border Bottom biru 3 pt."], "raw": ["PERHATIAN!", "Pendaftaran ekstrakurikuler dibuka sampai 30 Mei 2027 di ruang OSIS. Setiap siswa dapat memilih maksimal dua kegiatan.", "Hubungi pembina masing-masing untuk informasi lebih lanjut."], "fmt": ["c b 18 #c00 bx", "j bx", "c i bb"], "rubric": [["Border Box pada judul dan isi", 40], ["Shading biru muda", 30], ["Border Bottom pada baris akhir", 30]]}], [{"title": "Jadwal Pelajaran (Tab Rata Kanan)", "goal": "Memakai Right Tab agar kolom kanan rata sejajar.", "steps": ["Ketik teks dengan satu tombol Tab di antara hari dan mata pelajaran. Simpan sebagai Latihan3-1.docx.", "Judul: Bold 14 pt, Center.", "Blok lima baris jadwal → Paragraph → Tabs → Position 12 cm, Alignment Right, Leader None.", "Pastikan nama mata pelajaran rata kanan pada margin yang sama."], "raw": ["JADWAL PELAJARAN KELAS XI MM 1", "Senin\tMatematika", "Selasa\tBahasa Indonesia", "Rabu\tDesain Grafis", "Kamis\tPemrograman Web", "Jumat\tPendidikan Agama"], "fmt": ["c b 14", "tb", "tb", "tb", "tb", "tb"], "rubric": [["Memakai Tab, bukan Spacebar", 30], ["Right Tab pada posisi 12 cm", 50], ["Judul terformat", 20]]}, {"title": "Daftar Isi (Tab Leader)", "goal": "Membuat daftar isi dengan Right Tab dan Tab Leader titik-titik.", "steps": ["Ketik teks dengan satu Tab sebelum nomor halaman. Simpan sebagai Latihan3-2.docx.", "Judul: Bold 14 pt, Center.", "Blok lima baris → Tabs → Position 14 cm, Right, Leader 2 (titik-titik).", "Periksa bahwa nomor halaman rata kanan dan titik-titik terbentuk otomatis."], "raw": ["DAFTAR ISI", "Kata Pengantar\ti", "Bab 1 Pendahuluan\t1", "Bab 2 Pembahasan\t7", "Bab 3 Penutup\t15", "Daftar Pustaka\t18"], "fmt": ["c b 14", "ld", "ld", "ld", "ld", "ld"], "rubric": [["Right Tab pada 14 cm", 35], ["Tab Leader titik-titik", 45], ["Judul terformat", 20]]}, {"title": "Nota Belanja (Decimal Tab)", "goal": "Menyejajarkan angka desimal dengan Decimal Tab.", "steps": ["Ketik teks dengan satu Tab sebelum angka. Simpan sebagai Latihan3-3.docx.", "Judul: Bold 14 pt, Center.", "Blok empat baris → Tabs → Position 12 cm, Alignment Decimal, Leader 2.", "Baris “Total” di-Bold dan pastikan koma desimal sejajar."], "raw": ["NOTA BELANJA KOPERASI", "Beras 5 kg\t62.500,00", "Minyak Goreng 2 L\t34.000,00", "Gula Pasir 1 kg\t16.000,00", "Total\t112.500,00"], "fmt": ["c b 14", "ld", "ld", "ld", "ld b"], "rubric": [["Decimal Tab menyejajarkan koma", 50], ["Leader titik-titik", 25], ["Baris Total Bold", 25]]}], [{"title": "Drop Cap Dropped", "goal": "Membuat Drop Cap bergaya Dropped pada paragraf pembuka.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan4-1.docx.", "Judul: Bold 20 pt, Center. Paragraf: Justify, spasi 1,5.", "Klik paragraf → Insert → Drop Cap → Dropped.", "Drop Cap Options: Lines to drop 3, Distance from text 0,2 cm."], "raw": ["Pagi di Kampung Nelayan", "Matahari baru saja muncul ketika perahu-perahu kecil mulai bersandar di dermaga. Para nelayan menurunkan hasil tangkapan semalam, sementara para ibu sudah menunggu untuk menawar ikan segar. Suasana pagi itu ramai namun hangat, penuh canda dan tawa."], "fmt": ["c b 20", "j sp dc"], "rubric": [["Judul terformat", 20], ["Drop Cap Dropped 3 baris", 50], ["Justify dan spasi 1,5", 30]]}, {"title": "Dua Kolom Bergaris", "goal": "Membagi artikel menjadi dua kolom dengan garis pemisah (Line Between).", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan4-2.docx.", "Judul: Bold 20 pt, Center, tetap satu kolom.", "Blok tiga paragraf isi → Layout → Columns → Two.", "More Columns → centang Line Between, Spacing 1 cm, Apply to Selected text."], "raw": ["Tips Belajar Efektif", "Belajar efektif dimulai dari tempat yang tenang dan jadwal yang teratur. Tetapkan waktu belajar yang sama setiap hari agar tubuh dan pikiran terbiasa.", "Gunakan metode mencatat dengan kata kunci. Catatan singkat lebih mudah diulang dan membantu mengingat inti pelajaran dengan lebih cepat.", "Jangan lupa beristirahat. Setiap empat puluh lima menit belajar, berhentilah lima menit untuk meregangkan badan dan minum air putih."], "fmt": ["c b 20", "col j", "col j", "col j"], "rubric": [["Judul tetap satu kolom", 20], ["Dua kolom dengan Line Between", 50], ["Justify", 30]]}, {"title": "Buletin Tiga Kolom", "goal": "Menggabungkan tiga kolom, Drop Cap, dan judul garis ganda.", "steps": ["Ketik seluruh teks dan simpan sebagai Latihan4-3.docx.", "Judul: Bold 22 pt, Center, beri Border Bottom garis ganda.", "Blok empat paragraf → Columns → Three, aktifkan Line Between.", "Beri Drop Cap Dropped pada paragraf pertama."], "raw": ["INFO SEKOLAH", "Penerimaan siswa baru tahun pelajaran 2027/2028 akan dibuka mulai bulan Juni. Calon siswa dapat mendaftar secara langsung maupun melalui situs sekolah.", "Sekolah juga membuka kelas persiapan bagi cal const save=()=>{try{localStorage.setItem('lmsword',JSON.stringify(st))}catch(x){}sync()};
const $=id=>document.getElementById(id);
const toast=t=>{const o=$('toast');o.textContent=t;o.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>o.classList.add('hidden'),2400)};
const score=i=>EX(i).rubric.reduce((a,r,k)=>a+(st['r'+i+'-'+k]?r[1]:0),0);
function stats(){let d=0,t=0,s=0,n=0;M.forEach((m,i)=>{m.steps.forEach((_,j)=>{t++;if(st[i+'-'+j])d++});if(st['d'+i]){s+=score(i);n++}});
 M.forEach((_,i)=>(SUB[i]||[]).forEach((x,k)=>x.steps.forEach((_,j)=>{t++;if(st[i+'s'+(k+1)+'-'+j])d++})));const p=Math.round(d/t*100);$('pct').textContent=p+'%';$('pm').textContent=p+'%';$('bar').style.width=p+'%';$('avg').textContent=n?Math.round(s/n):'–'}
function nav(){$('nav').innerHTML=TOOLS()+M.map((m,i)=>{const S=SUB[i]||[],dn=(st['d'+i]?1:0)+S.filter((_,k)=>st['d'+i+'s'+(k+1)]).length,on=!pg&&i===cur;
 return `<button class="nav-btn ${on&&!sub?'on':''} ${open(i,0)?'':'opacity-50'}" data-i="${i}">${!open(i,0)?'🔒':st['d'+i]?'✅':'📝'} Latihan ${m.no}: ${m.title}<span class="block text-xs opacity-70">${dn}/${1+S.length} bagian${S.length?' · '+S.length+' sub-latihan':''}</span></button>`+(on&&S.length?S.map((x,k)=>`<button class="nav-btn ${sub===k+1?'on':''} ${open(i,k+1)?'':'opacity-50'}" style="padding-left:1.8rem;font-size:.8rem" data-i="${i}" data-s="${k+1}">${!open(i,k+1)?'🔒':st['d'+i+'s'+(k+1)]?'✅':'▫️'} ${m.no}.${k+1} ${x.title}</button>`).join(''):'')}).join('')}
function render(){if(pg)return tool();const m=EX(K()),i=K();
 const tabs=[['b','① Before (teks awal)'],['a','② After (hasil)'],['c','⇄ Bandingkan']];
 $('main').innerHTML=`<div class="card p-4 mb-4"><h2 class="text-lg font-bold" style="color:var(--blue)">Latihan ${m.no}: ${m.title}</h2>
 <p class="text-sm mt-1">🎯 ${m.goal}</p><p class="text-xs mt-1" style="color:var(--mute)">Menu: ${m.menu}</p>
 <p class="text-xs mt-2 px-3 py-2 rounded-lg" style="background:var(--soft)">🔒 Teks tidak dapat disalin. Ketik ulang naskah <b>Before</b> di Microsoft Word, lalu format agar sama dengan <b>After</b>. Tanda tab pada naskah = tekan Tab sekali. Bagian berikutnya terbuka setelah bagian ini ditandai selesai (semua langkah dicentang).</p></div>
 ${(SUB[cur]||[]).length?`<div class="flex flex-wrap gap-2 mb-3 items-center"><span class="text-xs" style="color:var(--mute)">Bagian latihan:</span>${[[0,'Utama']].concat(SUB[cur].map((x,k)=>[k+1,M[cur].no+'.'+(k+1)])).map(c=>`<button class="chip ${sub==c[0]?'on':''}" data-s="${c[0]}">${!open(cur,+c[0])?'🔒 ':st['d'+cur+(c[0]?'s'+c[0]:'')]?'✓ ':''}${c[1]}</button>`).join('')}</div>`:''}
 <div class="flex flex-wrap gap-2 mb-3">${tabs.map(t=>`<button class="tab ${view===t[0]?'on':''}" data-v="${t[0]}">${t[1]}</button>`).join('')}<button class="tab ${exam?'on':''}" data-x="1">⏱ Mode Ujian ${exam?'<b id="tm"></b>':'(15 menit)'}</button></div>
 <div class="grid ${view==='c'?'':'xl:grid-cols-[1fr_340px]'} gap-4">
  <div class="sheet">${view==='c'?`<div class="grid md:grid-cols-2 gap-4"><div class="sheet">${paper(m,'b')}</div><div class="sheet">${paper(m,'a')}</div></div>`:paper(m,view)}</div>
  <div class="space-y-4"><div class="card p-4"><h3 class="font-semibold mb-2 text-sm">✅ Langkah praktikum</h3><ul class="space-y-2">${exam?'<li class="text-sm">🔒 Langkah disembunyikan pada Mode Ujian.</li>':m.steps.map((s,j)=>`<li><label class="flex gap-2 text-sm cursor-pointer"><input type="checkbox" class="mt-1 accent-[#2B579A]" data-k="${i}-${j}" ${st[i+'-'+j]?'checked':''}><span>${s}</span></label></li>`).join('')}</ul>
  <p class="text-xs mt-3 p-2 rounded" style="background:#fff8e1;color:#7a5b00">💡 ${m.tips}</p></div>
  <div class="card p-4"><h3 class="font-semibold mb-2 text-sm">📊 Penilaian mandiri</h3>${m.rubric.map((r,k)=>`<label class="flex gap-2 text-sm py-1 cursor-pointer"><input type="checkbox" class="mt-1 accent-[#2B579A]" data-k="r${i}-${k}" ${st['r'+i+'-'+k]?'checked':''}><span class="flex-1">${r[0]}</span><b>${r[1]}</b></label>`).join('')}
  <div class="flex justify-between items-center mt-3"><span class="text-sm">Skor: <b id="sc">${score(i)}</b>/100</span><button id="fin" class="px-3 py-2 rounded-lg text-white text-sm" style="background:${st['d'+i]?'#16a34a':'#2B579A'}">${st['d'+i]?'✔ Selesai':'Tandai selesai'}</button></div></div><div class="card p-4" id="aibox"><h3 class="font-semibold mb-2 text-sm">🤖 Tanya Asisten Meratno</h3><textarea id="q" rows="2" class="w-full p-2 rounded-lg border text-sm" style="background:var(--bg);border-color:var(--line);color:var(--ink)" placeholder="Contoh: koma desimal saya belum sejajar, kenapa?"></textarea><button id="ask" class="mt-2 px-3 py-2 rounded-lg text-white text-sm" style="background:#2B579A">Tanya</button><p id="ans" class="text-sm mt-2"></p></div></div></div>
 <div class="hidden md:flex justify-between mt-4"><button class="go card px-4 py-2 text-sm ${pos()?'':'invisible'}" data-d="-1">← Sebelumnya</button><button class="go card px-4 py-2 text-sm ${pos()<SEQ().length-1?'':'invisible'}" data-d="1">${(()=>{const n=SEQ()[pos()+1];return !n||open(n[0],n[1])?'Berikutnya →':'🔒 Berikutnya'})()}</button></div>
 <div class="md:hidden h-16"></div><div class="md:hidden fixed bottom-0 inset-x-0 flex gap-2 p-2 border-t" style="background:var(--card);border-color:var(--line);padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px));z-index:40"><button class="go card px-4 text-lg ${pos()?'':'invisible'}" data-d="-1">◀</button><button class="tab flex-1 text-center ${view==='b'?'on':''}" data-v="b">Before</button><button class="tab flex-1 text-center ${view==='a'?'on':''}" data-v="a">After</button><button class="tab flex-1 text-center ${view==='c'?'on':''}" data-v="c">⇄</button><button class="go card px-4 text-lg ${pos()<SEQ().length-1?'':'invisible'}" data-d="1">▶</button></div>`;
 nav();stats();after()}
const inp=t=>{const n=t&&t.nodeType===1?t:t&&t.parentElement;return n&&n.closest&&n.closest('input,textarea,[contenteditable]')};
['copy','cut','contextmenu','dragstart','selectstart'].forEach(v=>document.addEventListener(v,x=>{if(!inp(x.target))x.preventDefault()}));
document.addEventListener('keydown',x=>{if((x.ctrlKey||x.metaKey)&&'cxaspu'.includes(x.key.toLowerCase())&&!inp(x.target))x.preventDefault()});
document.addEventListener('click',x=>{const t=x.target;let b;
 if(b=t.closest('[data-p]')){pg=b.dataset.p;render();scrollTo(0,0);if(innerWidth<1024)document.querySelectorAll('#nav,.sx').forEach(x=>x.classList.add('hidden'))}
 else if(b=t.closest('.nav-btn')){if(!open(+b.dataset.i,+(b.dataset.s||0)))return toast('🔒 Selesaikan latihan sebelumnya dulu');pg=null;cur=+b.dataset.i;sub=+(b.dataset.s||0);render();scrollTo(0,0);if(innerWidth<1024)document.querySelectorAll('#nav,.sx').forEach(x=>x.classList.add('hidden'))}
 else if(b=t.closest('.chip')){if(!open(cur,+b.dataset.s))return toast('🔒 Selesaikan bagian sebelumnya dulu');sub=+b.dataset.s;render()}
 else if(b=t.closest('.tab')){view=b.dataset.v;render()}
 else if(b=t.closest('.go')){const q=SEQ(),n=q[pos()+ +b.dataset.d];if(n&&!open(n[0],n[1]))return toast('🔒 Tandai bagian ini selesai dulu (centang semua langkah)');if(n){cur=n[0];sub=n[1];render();scrollTo(0,0)}}
 else if(t.closest('[data-x]')){exam=exam?0:Date.now()+9e5;render()}
 else if(t.closest('#menuBtn'))document.querySelectorAll('#nav,.sx').forEach(x=>x.classList.toggle('hidden'));
 else if(t.id==='fin'){const k=K();if(!st['d'+k]&&!EX(k).steps.every((_,j)=>st[k+'-'+j]))return toast('Centang semua langkah dulu sebelum menandai selesai');st['d'+k]=!st['d'+k];save();render();toast(st['d'+k]?'Latihan ditandai selesai. Skor '+score(k):'Status selesai dibatalkan')}});
document.addEventListener('change',x=>{const k=x.target.dataset&&x.target.dataset.k;if(k){st[k]=x.target.checked;save();if(k[0]==='r'){$('sc').textContent=score(K())}nav();stats()}});
let TEACH=false,pg=null,exam=0,tick,DB=null,UID=null,tm,unsub;
const TL=[['dash','🧑‍🏫 Dasbor Guru'],['type','⌨️ Uji Mengetik'],['edit','✍️ Editor Mini'],['cert','🏅 Lencana & Sertifikat']];
const TOOLS=()=>`<p class="text-xs pt-1" style="color:var(--mute)">FITUR</p>`+TL.map(t=>`<button class="nav-btn ${pg===t[0]?'on':''}" data-p="${t[0]}">${t[1]}</button>`).join('')+(TEACH?`<p class="text-xs" style="color:var(--blue)">🔓 Mode guru: semua latihan terbuka</p>`:'')+`<p class="text-xs pt-2" style="color:var(--mute)">LATIHAN (terbuka berurutan)</p>`;
const open=(i,s)=>{if(TEACH)return true;const q=SEQ(),n=q.findIndex(x=>x[0]==i&&x[1]==s);return n<=0||!!st['d'+q[n-1][0]+(q[n-1][1]?'s'+q[n-1][1]:'')]};
const nd=()=>M.filter((_,i)=>st['d'+i]).length;
const av=()=>{const a=M.map((_,i)=>i).filter(i=>st['d'+i]);return a.length?Math.round(a.reduce((s,i)=>s+score(i),0)/a.length):0};
(async()=>{try{const[c,u]=await Promise.all([claude.use('db'),claude.use('user')]);DB=c;if(u){UID=await u.id();if(await u.canEdit()){TEACH=true;nav()}}sync()}catch(x){}})();
function sync(){if(!DB||!UID)return;clearTimeout(tm);tm=setTimeout(()=>{DB.doc('progress/'+UID).set({name:st.name||'Tanpa nama',done:nd(),avg:av(),steps:Object.keys(st).filter(k=>/^\d+-\d+$/.test(k)&&st[k]).length,wpm:st.wpm||0,at:Date.now()}).catch(()=>{})},1500)}
const bd='style="background:var(--bg);border-color:var(--line);color:var(--ink)"';
async function tool(){const m=$('main');nav();if(unsub){unsub();unsub=null}
 if(pg==='dash'){m.innerHTML=`<div class="card p-4"><h2 class="font-bold mb-2" style="color:var(--blue)">🧑‍🏫 Dasbor Guru</h2><div id="dt" class="text-sm overflow-x-auto">Memuat…</div></div>`;
  let ok=false;try{const u=await claude.use('user');ok=!!u&&await u.canEdit()}catch(x){}
  if(!DB||!ok){$('dt').innerHTML='Dasbor hanya tampil untuk guru (pemilik/editor halaman). Bagikan halaman ke siswa dengan akses <b>Contributor</b> agar progres mereka tercatat di sini.';return}
  unsub=DB.collection('progress').onSnapshot(s=>{if(pg!=='dash')return;const r=s.docs.map(d=>d.data()).sort((a,b)=>b.avg-a.avg);$('dt').innerHTML=r.length?`<table class="w-full text-left"><tr style="color:var(--mute)"><th>Nama</th><th>Selesai</th><th>Langkah</th><th>Rata-rata</th><th>WPM</th></tr>${r.map(x=>`<tr class="border-t" style="border-color:var(--line)"><td class="py-1">${e(String(x.name))}</td><td>${x.done}/${M.length}</td><td>${x.steps}</td><td>${x.avg}</td><td>${x.wpm}</td></tr>`).join('')}</table>`:'Belum ada data siswa.'},()=>{$('dt').textContent='Tidak dapat memuat data.'})}
 if(pg==='type'){const p=M[cur].raw[2]||M[cur].raw[0];m.innerHTML=`<div class="card p-4"><h2 class="font-bold mb-2" style="color:var(--blue)">⌨️ Uji Mengetik</h2><p class="text-xs mb-2" style="color:var(--mute)">Ketik ulang paragraf dari Latihan ${M[cur].no}. Menyalin dan menempel dinonaktifkan.</p><div class="p-3 rounded-lg mb-3 text-sm" style="background:var(--soft)">${e(p)}</div><textarea id="ty" rows="5" class="w-full p-3 rounded-lg border text-sm" ${bd} placeholder="Mulai mengetik di sini…"></textarea><div class="flex gap-3 items-center mt-2"><button id="tyd" class="px-3 py-2 rounded-lg text-white text-sm" style="background:#2B579A">Selesai</button><span id="tyr" class="text-sm"></span></div><p class="text-xs mt-2">Rekor Anda: <b>${st.wpm||0}</b> WPM (akurasi minimal 85%)</p></div>`;
  const ta=$('ty');let t0=0;ta.addEventListener('paste',x=>x.preventDefault());ta.addEventListener('input',()=>{if(!t0)t0=Date.now()});
  $('tyd').onclick=()=>{if(!t0)return;const v=ta.value;let ok=0;for(let k=0;k<Math.min(v.length,p.length);k++)if(v[k]===p[k])ok++;const acc=Math.round(ok/p.length*100),w=Math.round(v.length/5/((Date.now()-t0)/60000));$('tyr').textContent=`${w} WPM · akurasi ${acc}%`;if(acc>=85&&w>(st.wpm||0)){st.wpm=w;save()}}}
 if(pg==='edit'){m.innerHTML=`<div class="card p-4"><h2 class="font-bold mb-2" style="color:var(--blue)">✍️ Editor Mini</h2><p class="text-xs mb-2" style="color:var(--mute)">Latih Bold, perataan, indentasi, ukuran, dan warna huruf sebelum membuka Word. Blok teks lalu klik tombol.</p><div class="flex flex-wrap gap-1 mb-2">${[['bold','B'],['italic','I'],['underline','U'],['justifyLeft','Kiri'],['justifyCenter','Tengah'],['justifyRight','Kanan'],['justifyFull','Justify'],['indent','Indent+'],['outdent','Indent−']].map(c=>`<button class="px-3 py-1 rounded border text-sm" ${bd} data-c="${c[0]}">${c[1]}</button>`).join('')}<select id="fs" class="px-2 rounded border text-sm" ${bd}><option value="2">Kecil</option><option value="3" selected>Normal</option><option value="5">Besar</option><option value="7">Judul</option></select><input id="fc" type="color" value="#2B579A" class="h-8 w-10"></div><div class="paper ed" contenteditable="true" style="aspect-ratio:auto;min-height:280px;max-width:none">${e(M[cur].raw[2]||'')}</div></div>`;
  m.querySelectorAll('[data-c]').forEach(b=>b.onmousedown=x=>{x.preventDefault();document.execCommand(b.dataset.c)});
  $('fs').onchange=x=>document.execCommand('fontSize',false,x.target.value);$('fc').oninput=x=>document.execCommand('foreColor',false,x.target.value)}
 if(pg==='cert'){const n=nd(),B=[[3,'🥉','Pemula Word'],[6,'🥈','Mahir Format'],[9,'🥇','Pakar Dokumen'],[M.length,'🏆','Master Word']];
  m.innerHTML=`<div class="card p-4 mb-4"><h2 class="font-bold mb-2" style="color:var(--blue)">🏅 Lencana & Sertifikat</h2><p class="text-sm mb-3">Latihan selesai: <b>${n}/${M.length}</b> · Rata-rata skor: <b>${av()}</b></p><div class="grid grid-cols-2 md:grid-cols-4 gap-2">${B.map(b=>`<div class="rounded-lg p-3 text-center text-sm border" style="opacity:${n>=b[0]?1:.35};border-color:var(--line)"><div class="text-2xl">${b[1]}</div>${b[2]}<div class="text-xs" style="color:var(--mute)">${b[0]} latihan</div></div>`).join('')}</div></div>`+(n>=M.length?`<div class="paper cal" style="text-align:center;aspect-ratio:auto;border:6px double #2B579A;max-width:640px"><p style="font-size:12px;letter-spacing:3px;color:#2B579A">SERTIFIKAT</p><p style="font:bold 26px Georgia;margin:10px 0">Praktikum Microsoft Word</p><p>diberikan kepada</p><p style="font:bold 24px Georgia;color:#2B579A;margin:8px 0">${e(st.name||'(isi nama di sidebar)')}</p><p>yang telah menyelesaikan ${M.length} latihan dengan rata-rata skor <b>${av()}</b>.</p></div><button id="dlc" class="mt-3 px-4 py-2 rounded-lg text-white text-sm" style="background:#2B579A">⬇ Simpan sertifikat</button>`:`<div class="card p-4 text-sm">Selesaikan semua latihan untuk membuka sertifikat.</div>`);
  const d=$('dlc');if(d)d.onclick=async()=>{try{const dl=await claude.use('downloads');if(!dl)return toast('Unduhan tidak tersedia di tampilan ini');await dl.save({filename:'Sertifikat_Praktikum_Word.html',data:`<!DOCTYPE html><meta charset=utf-8><body style="font-family:Georgia;text-align:center;border:8px double #2B579A;padding:60px;margin:30px"><h3 style="letter-spacing:3px;color:#2B579A">SERTIFIKAT</h3><h1>Praktikum Microsoft Word</h1><p>diberikan kepada</p><h2 style="color:#2B579A">${e(st.name||'')}</h2><p>telah menyelesaikan ${M.length} latihan dengan rata-rata skor ${av()}.</p>`})}catch(x){toast('Penyimpanan dibatalkan')}}}}
function fit(){document.querySelectorAll('.sheet').forEach(s=>{const p=s.querySelector('.a4');if(!p)return;p.style.zoom=1;p.style.zoom=Math.min(1,(s.clientWidth-2)/595)})}
addEventListener('resize',()=>fit());
function after(){fit();clearInterval(tick);if(exam){const f=()=>{const s=Math.max(0,exam-Date.now()),t=$('tm');if(t)t.textContent=Math.floor(s/60000)+':'+String(Math.floor(s/1000)%60).padStart(2,'0');if(!s){clearInterval(tick);exam=0;toast('⏰ Waktu ujian habis');render()}};f();tick=setInterval(f,1000)}
 const b=$('aibox');if(b)claude.use('sample').then(s=>{if(!s)return b.remove();$('ask').onclick=async()=>{const q=$('q').value.trim();if(!q)return;$('ans').textContent='Berpikir…';try{const r=await s(`Kamu guru Microsoft Word yang sabar. Jawab dalam bahasa Indonesia, maksimal 120 kata, dengan langkah menu Word yang konkret. Latihan: ${M[cur].title}. Tujuan: ${M[cur].goal}. Langkah resmi: ${M[cur].steps.join(' | ')}. Pertanyaan siswa: ${q}`,{modelTier:'quick'});$('ans').textContent=r.text}catch(x){$('ans').textContent='Asisten belum tersedia.'}}}).catch(()=>b.remove())}
$('nm').value=st.name||'';$('nm').addEventListener('input',x=>{st.name=x.target.value;save()});
render();
</script>
